body:
  text: 范忠貞集巻八清苑劉可書編宸翰褒忠題䟦附乞言小引先忠貞公盡節閩疆叨荷䘏典優渥逾涯迺者立碑丘隴又䝉皇上親灑宸翰遴工鐫刻褒忠勵節鴻文與雲漢同昭臥虎跳龍御筆共金石永賁復將墨本詔賜寒家世世寳異崇惟貞觀手勅尚勤書苑之標淳化題摹多得墨林之贊矧旌忠草制馨香載埒于汗青而書聖臨池璀璨特超于飛白者乎頌言攸作懿典斯傳敬啓大人先生諦觀六文之麗則追琢有章精繹八法之芳規穆清成頌俾崇得纂綺文而作册若衆星之拱北辰彚墨寳而為林如百川之歸滄海奚第輝生蓬蓽亦將彪炳圖書矣謹啓瀋陽范時崇頓首載拜日講官起居注翰林院侍講學士臣高士竒拜手恭跋范忠貞節制閩疆蒞治未久即遘狂豎之亂執義不撓幽囚三年以炭畫壁作詩意惟上不負國恩下不背庭訓自勵卒及于難閩人至今言公從容就義赫赫聽聞昌黎韓子所謂特立獨行窮天地亘萬古而不磨者也事定之後朝廷諡贈塟祭典禮優加復御製碑銘親灑宸翰光寵其墓道焉竒身侍禁幄寒暑八年伏覩皇上留心人才一字之褒未嘗輕假獨于忠貞不靳數百言之琳瑯極八筆法之楷則命筆之際嘉歎愛惜深重其人異數酬忠不獨范氏子孫感激思奮凡有血氣當亦聞風興起其為世道人心繫誠非淺鮮矣内閣學士兼禮部侍郎臣徐乾學謹沐手恭紀閩總督范承謨以耿逆之亂盡節于閩賜䘏典諡曰忠貞皇上親製碑文更灑宸翰穹碑立于邱壟墨本賜之家庭褒忠之意若是其隆且渥也考之前代十扎之書頒及邦國所以警吏治飛白之書貽示後嗣所以重國本玊堂四字以美翰林則有意于重文學秘閣二字以寵秘書則有意于重閣職易簡形之天筆探易理之精有臺以賜台衡㑹詩人之㫖是皆上關于治理下切于風教豈僅僅翰墨之間哉今我皇上之褒忠也睠睠不忘有加無已宸章一布河漢齊輝心畫一形山河永奠龍翔鳳翥為之體霧捲霞舒擬其華豈特褒揚之盛典葢亦興起教化之本歟忠貞公精忠之節動搖山岳剛大之氣亘于穹壤得此雲章爛然照耀千載誠與天地同久日月爭光矣謹稽首拜手以書于後丹筆天書燦穹碑國典崇標芳埀澤逺灑墨拜恩濃聖眷榮泉壤臣忠勒景鐘袄氛摧勁節蝥賊敢稱凶報主心長赤臨危氣觸鋒青霜飛劍佩白日照芙容心畫銘貞石雲章濕紫封瑤光長繞室遙映九原松臣顔光敏伏讀宸翰褒忠碑恭䟦西漢距今千七百餘年顧其間偉人傑士如覿靣而與深交者則史遷之文為之也曹娥之孝樂毅之賢其為節也小矣而後生末學無不能舉其事則右軍之書為之也若夫以日星河嶽之文龍跳虎臥之筆而傳忠孝大節葢千百年未嘗覯焉今廼得于御書忠貞碑見之忠貞不死矣臣車萬育恭讀御書范忠貞碑文敬集謝句懐道彌厲仁徳怡怡屯難多阻九有同悲委身靡歎魂氣隨之川壑如泣痛百在兹皇心維眷援筆興言為爾苦節至理成篇徽容未逺命如可延緬念生平何時復還吏科給事中臣楊周憲伏讀宸翰褒忠碑文恭跋朝廷褒賞之典言為上物次之然言亦不過勤勤宣慰其大者或咨之太史至親為撰文而書以授其子若孫葢不數數見也閩督范忠貞公以閩寇死遂膺此異數天下聞之無不咨嗟太息曰為臣而能邀此異數葢亦僅矣因羣相勸夫羣相勸者由于風之勵之也然不舉其天經地義以及聖人持世之大道參之將為臣盡忠為子盡孝或值不得已之時而為之曰君父之需我如此也嗟乎忠孝何事而謂聖人强人以不得已乎夫聖人之所以為天下後世勸者言必出于自然事必期于共安其所以自然而共安者天之道也我皇上得天之道式臨萬方有不效其順者則稱天以奪之于諸冦是也有能致其命者則稱天以予之于范忠貞是也葢天之予人惟有忠孝一途舍此天若無一隙以處人人亦若無一隙以荅天生死好惡歸于大同而已且當時巖疆不乏捐軀之士而盛典亦或及民社之臣然其烈槩惟忠貞最著其議敘亦惟忠貞稱首是忠貞食皇上忠臣之報而皇上為忠貞啓造化之權也氣數所關不僅三世五世而直與日星雲漢共為昭回惟其得天之道焉爾所以凡有血氣觀感興起固羣相勸也然實不知其所以然而然也今之過忠貞墓者見天子降至尊而以入神之筆冩至性之文尤非强人以不得已皆人所不容自已者耳忠貞子弟聞皆好古而通天地民物之大因相朂曰聖人序卦陳詩終于人事春秋獨取天道職此故也大學士臣王熈謹讚於皇聖藻雲漢為章光華糺縵焜燿萬方㪚彩分輝翔流大澤褒揚忠貞寵賁幽石刻深羲畫立記堯年生金錯繡鑱玊澄鮮惟帝念臣忠徽圖史復將墨本賜畀其子奎璧上騰璿璣下照鳳集鸞迴虎臥龍跳襲以重錦金繩玊籖風勵忠孝頑懦立亷天光式臨赫奕無極百爾見聞靖共厥職㣲臣獲觀伏開瑶檢驚覩虹霓欣逢琬琰恩縈睿思妙結僊毫典謨同美容勢爭高寳氣祥􅈣旋繞巻素盪目聳神絡繹奔赴乾坤貞久日月常新表臣之忠天子至仁名顯當時􅈿藏後裔席慶䝉休雲耳萬世繩其祖武盡力効忠對揚墨寳𢎞纘家風大學士臣余國柱恭紀帝澤深如海褒揚曠代無龍章標勁艸鳳翥煥棲梧眷顧東南重疇咨閩越區鄰封借威望閫外倚訏謨棨㦸開疆日烽煙震海隅大臣不辱國完節矢捐軀舌擬常山絶身同夜室拘乾坤留正氣精魄返清都血記三年碧骨憐萬里枯宸衷憫悼切䘏典應偏殊幽隧穹碑立鴻文聖藻敷經營煩睿思冥漠荅忠孤飛白失莊雅八分遜楷模寳題榮馬鬛玊字聳龜趺搨本雲霄出貞珉日月俱普天皆感涕非獨泣顔烏大學士臣梁清標恭紀自昔寧忘戰云誰敢弄兵羽書傳箭密烽火照天明閩海如巢幕連江劇沸羮公方持節鉞時正擾欃槍衷甲嗟何及増埤恨早崩丹心空照燭碧血尚縱横聖世恩寛大凶人惡滿盈高牙壇上拜小醜馬前烹賞已分珪爵勲尤念死生美名埀竹帛顯諡錫忠貞廟享烝嘗祀門施棨㦸榮王言流渙汗宸翰勒瑤􅌦鳳似含毫舞鸞疑落墨驚豈惟誇七葉何止賜雙旌銀漢榮光爛金門異數并惟應傳萬世長祝泰階平大學士臣宋徳宜伏讀御書范忠貞公碑文恭賦帝恤封疆守義臣榮褒賁錫逈殊倫豐碑磊落懸霄漢御筆淋漓泣鬼神怨血感恩千載碧忠魂含笑九原春睢陽嚙齒常山舌曽及興朝異數新國子監祭酒臣翁叔元恭題豐碑嶻嶪表忠貞鳳翥龍翔䕶賜塋生縛反王如魏豹死傳臣節嫓眞卿廟謨親授天顔喜宸翰今頒御墨清肅拜几筵重展讀待看箕尾下瑤京大學士臣吳正治伏讀御書范忠貞公碑文恭賦二律其一欲掃長鯨不自由闔門同作九原遊南容徃烈千秋在西壁遺文萬古留碧血熒熒藏越嶠丹心烱烱照吳鈎氣為河嶽依然壯慷慨終能剪國讐其二聖朝六典厲臣忠特錫殊恩為匪躬百尺貞珉標翠碣五雲宸翰灑丹穹絲綸炳煜儀章重爼豆清嚴禮數崇從此奎文懸日月雲霄犖犖仰遺風大學士臣李之芳恭頌間氣攸鍾是毓名傑生為重臣殁于義烈奕奕范公七閩建節逆豎弄兵甘就覉紲忍死三年卒以剛折睢陽之齒常山之舌舉似忠貞天日為徹願化厲鬼吞彼狂孽聖辟聞之且褒且傷罪人既得我武允揚忠魂宛在式慰北邙載揮宸翰大言洋洋銀鈎鐵畫逺軼鍾王貞以珉石雲漢為章琬琰珍貴酒醴馨香范公名氏山高水長臣夏景松恭頌有名臣兮撫閩方沛徳澤兮民莫忘值變亂兮誓死封疆舍生取義兮鐵石為腸遺血化碧兮魂歸帝鄉帝念忠貞兮寵䘏靡量樹豐碑兮道之傍錫御書兮雲為章令子䝉恩兮涕霑裳奉異寳兮什襲以藏嗚呼千秋萬歲兮與日月而爭光尚書臣徐元文恭讀御書范忠貞公碑文敬述勁艸凌嚴風貞木挺歲暮豈惜千金軀臨難殉一顧范公奮高閥清修雅自樹雍容侍禁林燀赫馳皇路擁節来海疆毒蜃張黒霧知勇未及施盡室罹幽錮百折氣不懾孤節操彌固剖血灑千言蒼天仰為訴殺身足成仁蹈死乃樂赴精誠感神明寕假厲鬼怒須㬰昬氛銷方㝢廓天步至尊鍳純忠手自御毫素摛章炳日星降澤濡雨露哀思纒碑珉榮光耀隴墓聖心非徒甄臣節良可慕不見全軀者明哲反多誤倚公激頑懦百代凜矩度禮部右侍郎兼翰林院學士臣蔣𢎞道伏讀宸翰褒忠碑恭紀天地有大經君臣分所受正氣本自完况乃報忠厚閩越昔盜兵倉卒訌羣醜望風悉奉頭延喙或交手于時見純臣臨難殊不苟常山大義明威利徒惕誘敢求虞寄全期碎逆泚首終焉乃見圖罵賊不容口慷慨與從容二者實兼有古昔亦顯忠延賞惟章綬未必苦節心更入賀成後聖主曰不忘褒崇世無偶雲漢爛天章獨向哀忱剖亭亭擢鳳鸞燦燦陳蝌蚪爰以壽貞珉泉臺煥星斗君恩洵有餘臣骨已不朽詎獨為私榮昭然示永久致命而若斯於忠竟何負願以告来兹亦視忠貞否禮部左侍郎兼翰林院侍講學士臣嚴我斯仰覩宸翰褒忠碑恭紀國家養賢重綱常扶持正氣奠金湯篤生忠貞不世才文武作憲邦家光下鍾河嶽之間氣上含星日之光芒入侍禁近叅樞密出膺節鉞控巖疆倐歘祸亂起肘腋七閩震蕩海波揚盜兵潢池狂豎子憑陵豖突兼鴟張玊石毁焚椒蘭死誰挽琱弧射天狼忠貞浩然申大義百折不磨見剛腸幽囚三載如一日吞氊囓雪身琅璫從容就義甘如飴殺身報國何激昂九重震悼復嗟歎出師命將天威彰罪人既得付司敗賞功罰罪明王章廟堂公論久益定九原毅魄揚芬芳持加異數及存没諡曰忠貞義所當天文親製褒大節照耀川谷騰穹蒼復灑宸翰勒金石鸞翥鳳翽蛟龍翔貞觀湻化何足數典謨心畫追羲唐主恩臣節兩不朽頑懦奮興成忠良拜手作頌忝珥筆千秋萬世埀縹緗刑部侍郎臣張可前恭紀聖藻旌忠雲漢章跳龍臥虎燦縹緗圖書直比羲皇古翰墨雙分奎壁光太傅笏牙青簡動常山舌血兎毫香芝函霞起干天象㑹見瑶華撼九閶臣張集恭紀少保英靈逈未銷精神烱烱挺孤標騎箕身在星辰上􅀞閣名傳日月遥羝角騂旄吹朔雪屬鏤虹魄怒江潮閩雲燕嶺長相傍珍重恩綸錫聖朝臣周之麟㳟紀西湖不得遂勾留移節天南陷賊謀三載丹心依北闕一腔碧血灑榕州成仁取義應無愧宸翰奎章孰更優自是鴻名光史册何須俚句紀千秋臣衛執蒲恭紀巍巍名世舊從龍相業家聲重鼎鐘浙水提封尊繡斧閩天開府壯金墉光爭日月懸千古墨妙煙雲出九重大節爭看垂玊簡豐碑永峙墓門松臣劉謙吉恭紀黒風當日起南閩生者鬼耶死者神擊笏一朝原决絶臥薪三載倍酸辛身騎箕尾山河壯名畵麒麟日月新華表九天宸翰在聖人親灑勒貞珉臣胡昇猷恭紀憶昔癸丑黄鍾月奉使分巡漢川北忠貞開府正錢塘風骨稜稜嚙氷雪無何大逆起滇南煽動神臯連海窟帝曰閩江兩浙門特簡名臣寄節鉞忠貞閥閲世勳猷克膺大任樹磐石鯨波肅静僉謀同亮節清􅋵舒偉伐何期肘腋覬覦生頃刻笑談為敵國衆寡不侔强弱懸獨存大義曉羣逆賊畏公威環執公檻身剩有常山舌繫帛無鴻血淚枯北靣再拜甘斧鑕須㬰日黯天慘昬馬革誰收侍中血此時臣亦陷賊營正罹艱難遭百折人臣大節在捐軀生死何容間毫髮忠貞就義實從容擊節撫膺三歎息今逢廟算運神謨蕩平四海殲妖孽御文親製忠貞碑飛白鏤書書赫赫輝煌宸翰紫薇籠特勅神工摹石碣曠典由来止一人亘古耀今恩寵絶公神容與安斧堂對揚王休照耿烈珊瑚架筆編千官寳篆題詞紛史册忠貞大忠能致身忠貞大孝能竭力馬鬛蟠螭雲氣浮虎豹常關仙舄逸吁嗟乎忠臣生不忘君殁則榮天子萬年神聖奕臣卞三畏恭紀顯忠褒績古所羡異數孰有如今皇隆恩䘏典既稠叠貞珉又復錫龍章玊音􅈤惻麗金石宸翰飛灑輝琳瑯奉觀無不生感