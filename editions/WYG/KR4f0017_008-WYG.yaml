節不奪闔門死難之九死而靡他正氣凌霄壯六軍而殲賊從容就義國爾忘家骨委三山不愧王臣之蹇蹇恩懸九闕洊承天語之煌煌筆灑聖書永河山而不朽碑成宸藻同日月以爭光曠古以来未有盛典百世而下慕義無窮真足以愧天下後世人臣懐二心者丹心萬古青豈特墮峴山之淚熱血千秋碧寧止誇黄絹之詞揮涕跋言徒慚作頌臣沈涵伏讀御製褒忠碑恭頌近體二首其一閩南烽火暗江汀制府捐軀姓氏馨王允有心誅漢賊申胥無路哭秦庭三年瘴海旌旄落一夜蠻天劍血腥此日褒忠埀鉅典丹衷長照簡編青其二綸綍煌煌下九天豐碑高峙墓門前孤臣氣作山河壯聖主恩同日月懸碧海鶴歸雲𣺌𣺌白楊風動草芊芊甘棠南國思餘澤淚灑胥江煙水邊臣李應廌恭頌御製褒忠碑近體二首其一妖氛滾滾海疆昬籌䇿難施竟折轅緩死三年圖事濟捐生一旦報君恩寵章已慰忠臣恨怒氣猶吞逆賊魂宸翰揮時應墮淚貞珉長竝汗青存其二聖主褒貞恩獨優摛詞直竝典謨儔馨香醴酒光遺骨悲悼天章慰九幽墨本縱横傳玊筋丹心刻畫出銀鈎徃来樵牧皆埀涕况是忠肝萬古留臣王承祖恭頌排體八韻上相開金代元勲邁古人兩朝忠社稷一徳報君親内府謨猷大中丞建樹新旂常輝北極吐握制南閩化日甘棠茂淒風勁節伸絲綸揚鳳闕坊表擁麒麟名竝山河永恩叨雨露頻千秋光史册獨有此孤臣右春坊右諭徳兼翰林院修撰臣沈上墉恭題憶昔壬子秋賔興舉兩浙公時為監臨内外交整飭樗材幸際㑹得充鄉試列公雖非總裁留心采人物撤棘覽諸巻顧獨賞五䇿召吏速繕冩弆之箱與帙感懐頌知己心口未嘗歇迨乎登南宫備員擢常吉公􅃴移七閩因病覲天闕咫尺仰高山逡巡將伏謁已復奉簡書促之麾節鉞祗役嘆斯須寸心徒苑結維時履艱虞禍起在倉卒籌畫未及施肘腋已竊發武侯扇空存司農笏徒切龍虎失風雲幽囚困一室倚牆廢坐臥扼吭受饑渴迫脅雖百端堅忍終不屈束縛及手足防閑到紙筆猶作正氣歌淋漓化為血豈無田横士樊籠何由出王師埀奏功忠臣命先畢義從悉爭死誰能識骸骨夜臺應長嘯快覩小醜滅丹旐還故鄉白楊臨新穴天子為震悼精爽尚彷彿乆念忠魂羈今始慰優䘏虬螭冠宸章贔屭負修碣忠貞固無雙褒寵亦罕匹伏讀御製篇緬思省試日多士數千人芒鞋被裋褐堂上坐偉人錦衣貌氷雪風流表儒雅瀟灑神高潔藹藹吉人辭温温孺子色春風生懷袖吐納羣心悦終知柔能剛臨危志靡奪至仁成大勇從容彌激烈以兹豈弟心樹彼忼慨節幽通睢陽鬚㝠感常山髪氣已壯山河胸猶堆鬱㠥曠典有餘榮流涕敬載述日講官起居注翰林院編修臣喬莱謹題一聲戰皷撾閩中烽火直照天南東封狼䝟貐敢作逆仗節長憶忠貞公變生肘腋那可料獨以不二明其衷臨危忼慨目眥裂浩氣直欲摩蒼穹平原睢陽千載事俯仰颯颯生英風天陰雨濕白骨朽土花猶作斑斑紅皇天無私罪人得雷電一掃纖翳空直須半夜下淮蔡豈必百戰收崤潼頭懸靣縛詎足道上將已畫麒麟功剖珪悉荷受降賞耿耿九地憐孤忠大烝世配宗廟祀澤流後裔恩龎洪藎臣大節勒之石豐碑十尺煩磨礲龍騰鳳翥出寳翰天授豈得誇人工九霄不散霏霧繞五色時有宫雲籠公之丹心竝日月異數肯與尋常同榮光燭天賜書在世世傳守貽無窮翰林院編修臣吳一蜚恭跋忠臣事封疆仗節矢無二當其成仁時身家匪所計有偉范忠貞烈節昭天地秉鉞鎮閩方猝遭逆藩熾忼慨不俱生罵賊申大義闔室被拘囚三年操彌勵迫脅志不囘白刃如飴視日月為幽昬河嶽歸正氣天討一朝臨元兇授首至專車骨既尸嚼齒魂斯慰聖主特褒忠贈秩更予諡隆儀光九泉優典及後裔重念馬鬛碑揮灑出御製宸翰金石埀天章琬琰麗吁嗟一字榮千秋永勿替人生不百年頂踵皆君賜胡為偷視息俯仰能無愧范公得死所異數孰與儷令子重箕裘貞珉勒世世曰以昭君恩兼之示風厲翰林院編修臣彭寧求恭跋宸翰褒忠二十韻聖學如淵嶽光華溢藻翰玊軸錫臣工星陳復雲縵埀象徧神州山川増絢爛兹碑用表忠揮毫託深眷嚴正若端人沉雄抱骨榦頡驚籕愕眙瞪視不敢讚在昔閩海疆狂豎肆倡亂巖巖忠貞公大節金石貫平生敡歴處風操常侃侃肘腋禍變生百折腸不換截舌常山顔奮笏司農段長鯨既剪除孤臣益昭煥贈䘏厪皇情殊恩沐無算矧兹天章倬飛白逾貞觀九原拜稽首泉臺夜復旦河山指賜履秬鬯榮釐瓚詎若兹穹碑奎文掲霄漢遴工勒堅珉墨瀋無澷漶誰與淟涊生瞻仰面流汗傳示留無窮捐糜庶用勸翰林院修撰臣彭定求恭跋御製范忠貞公碑後排律二十韻山嶽鍾靈異巋然正氣存文瀾滙河漢道統溯崑崙鳳詔曽高步鸞坡毎細論公才堪保障帝命自臨軒俯瞰吳峰􅅢閒尋聖水源封章關國計惠愛遍黎元蔽芾棠留蔭謳歌野負暄七閩移重鎮兩浙盡攀轅忽覯妖氛熾幾令駭浪翻變從倉卒起外少甲兵援力竭難填海時窮欲呌閽百身嗟莫贖一死更何言未效秦庭哭空招楚澤魂六師来絡繹羣醜各驚奔臣節真無忝丹心動至尊精神懸日月忠義揭乾坤寳墨題中禁豐碑樹墓門芳名流奕䙫血淚漬雙痕宸翰光泉壤餘波及子孫小言附不朽瞻拜祝君恩翰林院編修臣顧藻恭跋御製范忠貞碑十六韻大節維千秋立身重名義激揚在朝廷褒忠殷帝志正氣鍾異人實作邦家瑞卓哉有范公堅貞性所畀七閩仰屏藩民社攸毗倚小醜忽肆虐狂逞如螳臂一木不能支膽張目裂眥鐵石作肝腸不受威與利奮笏哀司農常山舌更厲報國懸丹心一死如歸視崇朝蜃氣消雲淨欃槍墜始知天地間大義莫可貳天子為從容恩綸九重賁宸翰埀金石寵錫昭旌諡嗚呼脂韋流對此能無愧用矢歲寒心一灑孤臣淚臣費之逵伏讀御製褒忠碑恭紀巖巖巫閭穹瀠瀠混同列千尺有竒松百錬無凡鐵間氣名世鍾勲裔侍從列開府起瘡痍大澤滂流浙閩海控東南嵓疆寄重節狡逆肆烽烟嶺澨沸欲裂孤忠期自效猛祸剝膚切獨抱文山操惟存杲卿舌三載入牢籠堅白任磨湼畫壁誓靡他身在心先絶匕刃甘若飴氣盡衷猶熱報國留丹誠千秋凝碧血豐碑白九重宸翰綱維揭豈徒賁泉路將以䇿跛蹩舉朝頌貞珉况立程門雪三復琬琰光風雲為低咽臣徐潮恭紀生死乃晝夜旋轉車上輪形骸安足貴大義終當伸忠貞雖云殁亘古名俱存徃者封豕輩薦吞及滇閩駢首就西市轉盼飛埃塵始知天地内重者惟君親三年既囚縶忼慨難具陳此心照日月勁節凌松筠殺身尚不易况復憂沉淪奈何今世士局促如短轅恩榮慰泉壤睿翰光邱墳千秋遂俎豆忠魂庶可憑臨風幾嘆息涕淚沾衣巾臣胥琬恭頌十二韻華胄傳先烈東郊重保釐文章燕許筆節鉞范韓師元老猷方壯勞臣數獨竒潢池波欲沸大厦木難支忼慨帷中畫淋漓壁上詩孤忠貞自矢百錬操難移皎日酬吾志丹心答主知人倫存氣骨天壤見鬚眉青史流風逺皇恩奕葉埀絲綸標顯績翰墨灑豐碑馬鬛雄堂斧鴻名勒鼎彛家聲應未艾千載慕芳規翰林院編修臣周金然伏讀宸翰褒碑恭跋死事臣職也天地之大義無所逃焉寧望褒乎方忠貞公被繫時求死不獲日夕手厯書以當屬國之節嗚呼節旄落而武歸厯書存而公死等義也公尤烈矣哉天葢遲公三年之死以戒人之媮生而懐二心者夫媮生也而未必生視死如歸也而未必死顧以未必死之身而卒談笑嬰刃以遂其志公于是乎與日月爭光矣聖天子軫念死事諸臣優䘏厥後用昭大義于天下而于公之從容慷慨兼盡無憾恩數有加焉煌煌宸翰榮光燭天疇不瞻仰感激而奮興焉者要非公當日意計所及也公就義而職已盡心已安矣嗚呼君臣大義炳然天壤間矣日講官起居注翰林院編修臣孫岳頒伏讀宸翰褒忠碑文恭紀日月蝕光七閩草竊公任巖疆何敢明哲不以利誘不以勢刼睢陽豎眉常山奮舌皇皇大言賊威幾折幽羈于巢壁書指齧賊留國望甦斃挽絶見睍雪消結纓志决心死寒灰忠魂壯熱絶命留詞讀之哽咽賊肆小醜成公大節事業勛名豈惟兩浙炳若天漢皚如山雪天子震悼殊恩旌烈雖死猶生忠無恨血河嶽日星天章粲列嗟彼偷生計工實拙翰林院編修臣張榕端恭紀蓋聞仗義捐軀人臣之定分旌忠厲節盛世之鴻規自三孽不靖封疆有死事之臣皇上扶掖綱常激揚名教毎加贈䘏備極優崇兹御書故閩督諡忠貞范承謨墓碑既遴工鐫石復將墨本裝賜其家俾世守之臣備員載筆獲與觀瞻不獨奎章寳翰星日昭回超軼百家為亘古所未有又以知朝廷褒顯忠節廣厲羣工之意其為教甚大非特如前代賜書飛白誇一時榮遇之比也謹拜手稽首而繫以頌頌曰倬彼天章光昭雲漢聖學淵深餘波綺散側勒努䇿筆力迴斡戈法永興蘭亭登善左規右矩珠聨璧貫錫此鴻寳百僚是勸曰爾忠貞世為國幹名輔之子牧圉實扞時逢閩海逆豎倡亂變生肘腋當幾内斷嚼齒惟張奮笏如段大節英聲千錘百錬帝眷純忠豐碑首建銀鈎鐵畫親灑宸翰鏤劖精工蔚然炳煥還將墨本俾作家券金題玊􅉜什襲毋玩忠魂未冺泉臺復旦載拜君恩千秋貞觀曲阜賜履文人釐瓚未若兹碑天語褒讚豈惟一家輸忠無倦亷頑立懦面赤流汗聖訓孔彰捐糜共願凡百有位視兹臣鑑翰林院編修臣李鎧伏讀御書范忠貞公碑文恭賦閩疆無故突長鯨滿地狂瀾艸木驚仗鉞幾人伸大義臨危百折見平生丹心百世河山壯宸翰千秋日月明臣節君恩今古盛墓門高望淚縱横臣許汝霖恭紀盛事都從國史論日星河嶽是忠魂捐軀幾輩曽當局抵掌何人不大言萬里封疆歸舊服千秋朝典荷新恩可知聖主追崇意原為遺風及子孫翰林院編修臣尤珍伏讀宸翰褒忠碑恭紀皇帝御極二十有一載河清海晏靖八荒兢業萬幾有餘暇圖書翰墨常焜煌㣲臣幸直承明廬翹首雲漢窺天章傳来榻本更神異榮光逺燭萬丈強玊字金函日月麗銀鈎鐵畫龍鳳翔焚香盥手敬展讀大哉聖謨何洋洋褒錫忠貞銘泉壤親題御筆碑十行忠貞昔年督八閩矯矯風節凌氷霜擁旄仗鉞建幕府甲兵數萬胸中藏逆豎倐忽跳梁出患生肘腋驚倉黄豹畧龍韜未及施長蛇封豕爭鴟張闔室幽囚歴三載迫脅刀刃絶衣糧丹心終隨白日炳浩氣直亘青霄長常山之舌司農笏罵賊喪膽擊賊傷從容忼慨兼有之死為厲鬼掃妖芒只今逆豎齊授首蕩平獻俘開明堂帝曰孤臣忠且貞易名賜諡傳芬芳䘏典頻仍禮秩殊製文灑翰封崇岡嗚呼忠貞終不死身騎箕尾遊天閶黙佑我皇運神武坐清薄海恢蠻鄉令威化鶴倘来歸顧視貞珉愴中腸為臣死忠乃常分隆恩異數非敢望我皇褒錫良有以欲與萬代扶綱常麒麟圖畫古所羡豈若奎文森琳瑯只看隧道松楸表豐碑夜夜騰輝光子孫世守永勿失願䕶景厯同無疆翰林院檢討臣許嗣隆恭紀河嶽之姿日星之氣鍾為偉人誕表靈異於惟忠貞平津哲嗣風骨崚嶒性情端毅彤珥華階節鉞重寄倉卒閩疆蜂豺鼎沸智不及謀勇不及備煽虐逞殘公遭縶繫脅以甲兵㗖以祿利反覆百端聲色愈厲鬚髯㦸張怒裂目眥丐死弗能舉家幽閉絶粒吞氊勉圖後計嬉笑怒罵凜凜大義困阻三年迴環五内兇焰未銷難挽事勢罵賊捐軀引决奚避刀俎戈鋋如飴如薺臣力已竭臣心未遂血灑魂歸完生平志天討奮興罪人斯致銅鑕藁街剪除狂悖公之孤忠久而不昧帝曰欽哉臣能死事金石操堅松筠節勵不有曠典褒䘏何謂百職拊衷九重雪涕震悼既寧載錫爾諡旌以忠貞用昭不二復煥鴻章表其幽隧鳳羽龍文煌煌聖製磨之治之埀諸鐫記七尺豐碑千夫贔屭映彼河山埓于帶礪皇心惓惓縹緗再賜寳墨澄鮮御書遒麗虎跋鴻驚牙籖錦字玊璽光涵金函寵界勒兹貞珉鼎鏞作配天澤無疆忠魂永慰粤惟先臣亦遭狂猘之死靡他旦旦信誓慨然雉經甲申之季上被𢎞庥樹祠予祭宸藻褒揚春秋不匱忠愍忠貞或可附驥若水常山公誠不愧國典堂堂君恩滂沛天錫孝子家承難弟青史炳彪萬有千歲臣叔諱直以吏部考功郎死崇禎甲申三月之難䝉世祖章皇帝賜諡忠愍廕其一子仍命有司春秋致祭亦異數也故篇末及之翰林院檢討臣路元升伏讀宸章竊歎我國家褒錄忠義之典若斯之厚也于是不揣固陋而為之贊曰於赫天章倬彼雲漢勵節褒忠遏惡揚善沾灑九天昭宣寰宇霞蔚雲蒸㢲風雷雨欽兹墨寳特賜廕臣用光泉壤詔爾子孫汝先閩督前徽式穀不負國恩無忝科目捐生忼慨就義從容握拳嚼齒百煉剛鋒崇拜稽首對揚寵命琬琰輝煌玊簡金鏡八法麗天六書滙海羲畫禹疇于是焉在國家養士股肱心膂斧鉞所加亂臣賊子皇矣上帝赫赫明明照臨下土福善禍滛皇帝命討奉若天道匪臣之私忠貞是保仰止作頌詞臣珥筆億千萬年式昭臣極翰林院檢討臣潘麒生恭紀御製褒忠碑後皎皎孤臣節巍巍千載名挺生關國運抗志振家聲方沛錢塘澤旋移甌越旌妖氣起肘腋白日誓精誠忼慨義不屈艱虞氣益貞甘為袁粲死羞作褚淵生壁稿何悲壯丹心感聖明穹碑山嶽峙宸翰子孫榮展巻驚風雨披函燦玖瓊筆飛疑鳳翥墨灑似龍行褒䘏恩逾渥泉臺骨益嶸世將鴻寳秘莫忘至尊情翰林院編修臣張廷樞恭紀忠貞大節著危疆閩海時飛六月霜縱是孤城同虎穴總􅂸一死任鴟張魂歸華表煙霞麗祠繞青松日月長恭遇昇平酬地下九重寵錫有餘光翰林院檢討臣李復泌恭紀當朝烏府再臨戎秋色襜帷閩海風白日熊旌馳閫外綘霄魚鑰靜師中世勲元是三朝裔孤悃重光六代忠仗義從容名最著褒章次第出龍宫刑部主事臣張顧行恭紀聖朝柱石屬元公閩海爭傳帶礪雄棨㦸臨山深雨露旌旗照水靜魚龍一門忠節埀青史千載勲名光紫封巳見褒章崇䘏典行看金石勒鴻功翰林院編修臣錢中諧恭跋御書原任福建總督加贈太子少保兵部尚書諡忠貞范承謨碑文後皇上神功聖徳申明命討大逆已除褒忠益亟其于閩督范忠貞之殉節也既錫之以嘉諡祭葬禮有加等兹者隧道之碑復䝉宸翰親灑大書特書俾丹忱之剖竝日月以爭光碧血之埋與金石而不朽不獨范氏子孫得沐恩寵于世世實俾在廷文武蔑不感風慕義震動激昻嗚呼致身者人臣之分顯忠者有國之經中諧嘗讀唐李愬傳見以名父之子克平淮孽乃卒死亂軍千載云遙猶為出涕今忠貞承文肅之家聲由儒臣而建節矢死圖報固其所也至皇上睠念之深親御翰墨較之前代旌忠僅僅于表里賜廟實過之矣人曰願為良臣不願為忠臣然以今日而遘此盛典為忠臣者不大幸哉臣曹鑑倫伏讀御書范忠貞碑文恭紀古人知巳重大賢况屬丹青萬䙫傳手扶正氣星斗旋取義成仁百錬堅此身報國何足全攪海能令波復恬靈旗前導殪狂顛褒忠御册麗寳躔龍光鳳彩煥九淵從容忼慨大節兼聖皇洞鑒真無前豈特飛白史所傳霱雲蘂露倉頡篇心印留丹照八埏血痕化碧熒千年家世功業在凌烟綿綿恩數金石鐫倫也後學昔仰瞻文章曽有國士緣講堂身欲附三鱣延平神劍飛旻天拜手恭誦捧璣璿乘箕騎尾猶儼然肅如問業立青氊願攄感激申閟泉忠貞植節炳坤乾臣董誾恭頌御書范忠貞碑里言十六韻三韓鍾正氣一代有完人相業希文後風標孟博倫早年掄蘂榜中秘侍楓宸建節綏全越揭旌制七閩政清羣吏肅澤渥萬家春肘腋飛蠻瘴艱危動海塵心丹知取義血碧誓成仁鍛錬肝逾烈羈囚志愈伸抗奸同秀實罵賊繼張巡翠榦凌霜雪青鋒泣鬼神時平誅賞定身後是非真聖世標貞節元臣靖險屯褒忠周諡法錫爵漢絲綸華表雲霞燦金題日月新臨摹行似錦鈎畫體如銀玊簡輝鐘鼎天章壽石珉永兹箴有位翼翼仰高旻臣黄任伏讀御書范忠貞公碑文恭賦二律其一從龍年少已鱗攀枚馬文章供奉班開府流風清似水揮戈迴日節如山人間留取丹心照海上爭傳碧血殷獨立古今身世外高阡表道動天顔其二孤臣一片只剛腸綸語崇褒賁斧堂月照寒碑終古白風飄御墨滿城香紀庸已􅇺千秋石表節猶餘七寳牀聖世由来名義重相期百爾勵朝常臣熊賜瓚恭跋御書范忠貞碑文後里言十韻盛代濟川才忠貞亦壯哉丹心銜日月浩氣逼風雷劒㦸鬚眉豎悲歌畫壁哀蠟傳無斥堠鼠盡莫竒侅兵解顔公去魂招屈子来鼎鐘鏤姓字碑碣表崔嵬舊匣青萍吼新篇紫禁裁淋漓搴八法卓犖動三台報國身何惜成功死不灰孤臣千古事珥筆大書該臣沈朝初恭跋妖䘲昬閩海台星一夜沈兇鋒縱酷烈正氣轉蕭森三載幽囚日平生忠孝心疾風臣節苦湛露主恩深天藻豐碑刻奎鉤御筆臨千秋埀琬琰百世寳璆琳寵溢絲綸掌光生翰墨林毉閭山下路應見字生金臣熊一瀟恭紀希文而後有真儒取義成仁誓不渝信國從容今竝烈睢陽慷慨古為徒魂誅叛逆歸遼表氣壯山河拱帝都主聖臣忠青史在千秋御筆耀重壚臣閻世繩恭紀乾坤培正氣楓陛表忠臣金石堅孤操欃槍禍七閩守疆圖報國取義自捐身碧血昭千古丹心動聖人龍章褒䘏典馬鬛豆籩新宸藻揮麟鳳貞魂泣鬼神琬琰埀世寳雲漢映幽珉百䙫承高厚繁星嚮北辰翰林院庶吉士臣黄軒伏讀御書范忠貞公碑文敬紀忠有順逆順者易盡逆者難全竊見夫人平居自許必為孝子必為忠臣苟時值艱危必不改其素履聽其言真足以貫金石泣鬼神迨至凶燄肆虐遂依違遷就希圖苟容耿介之操一旦易之所為處忠之順易處忠之逆難洵不誣也若忠貞公可謂終始不渝者矣方其居恒自命挺然不回毎讀出師表至鞠躬盡瘁死而後已常嘆慕其為人及遭閩逆視死如歸從容就義誘之以利不動迫之以威不屈脅之以不得不從之勢而終不變其節視身家而不恤甘鈇鑕而如飴大節著于天壤忠藎光于日月史傳所稱巡逺真卿炳耀千古何以加焉今天子閔其忠烈褒恤優渥臣雖愚陋無文欣逢旌忠大典仰止休風敢敬綴言以附簡編之末大理寺少卿臣徐誥武伏讀宸翰褒忠碑文恭紀忠貞亮節清操久擅氷壺之譽投艱遺大益標松栢之姿向者小醜陸梁蠻烟亘連瘴海遂爾孤忠激烈浩氣直走灘蹊三載拘囚室家誰保一朝致命血淚徒揮洵稱守義全人不愧成仁志士迨皇威逺播聿申問罪之師且寵命丕彰爰沛褒忠之典宸章煥彩如聞玊振金聲御墨生香共羡銀鈎鐵畫從此姓名炳耀映星斗以齊輝自應遐邇流傳偕河山而共永矣臣王遵訓恭讀宸翰褒忠碑敬跋忠孝由来無二理發于至性幾能全性同今古殊時勢大節難移賴仔肩淵源家學重朝野箕裘世業克光前早歲巍科綴閬苑鳳池毛羽常翩翩十載禁林恣論討一朝秉鉞掌威權湖畱畫舫歌遺澤山入閩疆頌解懸時方清晏憂虞切隄防竊發起烽烟戎潛肘腋猝難制裂眥疾呼張空弮縱經百折心不易國爾忘家軀可捐丈夫烈烈行其志慷慨豈欲後人憐事平天子别功罪褒以宸翰示綸宣炳然臣節昭青史家世忠貞奕葉傳勒之金石應難朽聞此清風勵後賢翰林院編修臣史䕫恭紀宸翰褒忠碑陰當代司勲籍忠貞孰比肩夙推麟閣望舊列鳳池賢秉鉞雄三竺專樞壓九仙甲兵胸久裕襦袴頌頻傳雨露嗟来暮星雲快覩先逆藩驚草竊窮島倐兵連銜木思堙海鳴弦擬射天高風能不辱壯氣獨無前鼎鑊丹誠在衣冠碧血濺臣心惟一死王氣自千年瘴洗黄河水兵銷紫塞煙臨衝奔突騎下瀨放樓船廟勅干條畧師行萬里旋獻囚歌在泮列戍重開邊帝曰功難并僉云賞世延易名聲籍籍錄子澤綿綿鳳彩圖球燦鴻文琬琰鐫金章八體備玊版五花鮮國士今如此羣公各勉㫋翰林院檢討臣金徳嘉恭紀人臣奉璽書出守封疆一旦變起倉猝輒捐糜頂踵以殉之此臣道也國家錄死事諸臣䘏典優渥所以明大義于天壤若夫宸翰頒賜俾世世子孫毋忘先臣之媺則范忠貞特膺異數云葢自三蘖削平先後盡節之臣次第褒錄命討大義炳若日星上念閩疆督臣之死事為最烈其獨立不懼于羣兇之中為最難其以慷慨赴死之身拘繫檻阱偹受荼毒之歲月為最久而前是沈幾觀變思患預防灼見為最先而用心為最苦是以軫䘏有加焉臣嘗逖稽史册若卞壼張巡顔真卿之屬千載下猶凜然有生氣而其時之亂臣賊子禍不旋踵身名俱滅天道良可畏哉皇上之心天心也雷霆之所摧壓鮮不顛隕至于栽培所及匪惟雨之又潤澤之嗚呼凡厥庶民受中以生咸有恒性覩兹激勸夫亦逾知義矣臣仰瞻宸翰謹拜手稽首而恭識于後刑部廣西司主事臣王無忝恭紀高平范氏自文正公而後累世多名臣彪炳史册未易更僕福建總督贈太子少保兵部尚書諡忠貞范承謨文肅之子文正之裔孫也由甲科侍從禁林宸眷最渥未幾膺簡命出撫兩淛淛之人咸愛戴之已而移鎮閩疆適值逆藩之變禍生肘腋孤立無援因陷賊檻阱中賊百計脅之矢死不屈卒遇害同時守土諸臣固亦有挺身就義者而忠貞以節鉞之重誓不辱國歴三年如一日捐七尺若㣲塵尤耿耿不可磨也賊平天子追錄死事之臣愍其烈節褒䘏有加復親灑宸翰勒于製珉而以墨本賜其子時崇俾世世永守臣偹員秋曹得于時崇家仰觀御筆之神妙冠絶古今又竊窺夫褒徳顯忠之意所以風厲百職昭兹来許者實深且逺夫當世士大夫之家得隻字尺蹏猶什襲以藏與大貝赤球相為焜耀况乎以龍文鳳羽勒之馬鬛螭封其埀世貽謀又烏可量乎夫非常之寳必有榮光起而燭天其精氣不可掩也今墨寳所在亦必神物為之呵䕶星雲萃其禎祥世篤忠貞翊天室而庇本支輝映乎旂常竹帛者必由此也夫翰林院庶吉士改授科道臣顧鐔伏讀御製范忠貞碑文恭識忠貞之大節著于閩忠貞之治蹟著于浙方公之撫浙也三年之内水旱蟲孽竒荒叠告公請蠲于朝且請改折漕米耗贈經費悉充正課而民得減價以輸又復設法賑施民忘其饑盗賊不作公私賴焉其馭屬吏也未嘗苛察示威而逺近澄清凜凛焉常若公之糾乎其側而不敢為非下至胥役亦皆守法畏罪無敢欺者非其時有賢無不肖其守正不阿有感人于㣲者矣百姓以事至公庭公片言輒得其情民驚服不敢騁辭訟獄用稀凡有興革皆洞悉利弊人不能奪請覲歸京師浙之人士攀轅號泣如孺子之失父母公駐節􅇺勞數百里内相繼不絶僚屬皆嘆息相顧曰民情感慕若此為人上者奈何不法公自効乎葢公之亷潔愛民自其性成不為貌飾常㣲行以周知里巷之隠然沈深不露人莫能窺其喜愠故始終莫敢以私邀公後之繼公者亦多重公之為人指公以自况然畏威懐徳卒莫有如公者亦可以覘厥本源矣及公再出督閩道經浙浙人攀迎如公去浙時閩逆之變浙人咸泣曰我公必死至幽繫既久浙人亦無敢望公生還者葢公之大節素孚于浙人固知公抱必死之志也今逆賊既平忠貞益著上有聖天子之褒崇綸音炳煥下有公卿大夫學士之題跋詩律琳琅鐔不敏謹摭公治浙之大畧用附于簡編之末以表聖朝忠節之臣若夫發為詩歌作為傳紀則請以俟之能者翰林院庶吉士候補科道臣劉國黻恭紀無路天關呌帝閽狂童逆斾海東翻狼烟一炬終臣節馬革猶懸報主恩汗簡久標閥閱最大烝復覩姓名存千年血作熒熒碧知是孤忠九地魂臣王九齡恭紀七閩曩歲突烽烟慷慨忠貞取義年志比氷霜猶覺凜肝同鐵石未為堅褒忠御墨龍蛇動罵賊芳名竹帛傳惆悵英魂歸碧落空山血淚灑啼鵑臣韓雄岱恭紀忠貞祠下謾低徊石馬悲風最可哀萬里孤魂真慘淡千秋大節獨崔嵬常山恨雪何妨死睢水音沉竟不回自是聖朝恩䘏渥鸞文遥下九天来翰林院庶吉士今候補科道臣王伸伏讀宸翰褒忠碑文恭贊煌煌世臣經文緯武身任封疆仗鉞開府電掣霆鍧折衝樽俎所至有聲勲在牧圉變起倉卒鼠竊狗偷陰陽施設腹背戈矛無衣載賦蔑與同仇舉步檻阱極目幽憂當此之時致命遂志嗚呼忠貞浩然者氣被繫三年顛連泣血臥起自如蘇武之節正月朝元稽首北闕相爾羣兇終當殄滅捨兹肝腦塗彼河湄雙眸炯炯視汝燃臍天誅奄至寇無孑遺皇帝曰咨有臣匪躬爰錫宸翰勵節褒忠詒厥孫子令緒昭融匪曰爾私命討維公巍巍豐碑麗霄挿漢臣道以彰美名攸煥億萬千年日星爛熳小臣仰瞻載筆斯贊刑科給事中臣楊爾淑恭跋御書范忠貞碑文後皇皇后皇聖敬日崇執中御厯車書攸同蠢彼小醜鴟張于閩赫赫司馬為國藎臣天討聿張罪人斯得功罪既明刑賞是亟皇皇后皇悼兹忠貞䘏典有加綣綣皇情牲牢享之封植廣之贈階錫諡于焉賞之皇矣天學蕩蕩巍巍皇矣天章雲漢昭回壽以貞珉載瞻載吁百爾臣工敬慎所趨臣郭恒恭題宸翰褒忠碑七言古風一首忠貞挺挺人間傑浩氣剛風樹竒節鎖鑰東南控海疆直坦丹心呌天闕百折孤忠盪逆鋒九仙獨濺常山血帝眷優崇䘏近臣龍文親灑磨崕碣鐵畫銀鈎貫斗樞英精髣髴臨丹穴偉烈殊恩照古今不羡凌煙恣塗抹歴落松楸繞墓門棲烏啼斷寒濤咽十隊靈旗拂絳霄凜凜精魂日凝結臣王連瑛勉贅里言一章恭紀范忠貞盡節閩疆寵荷褒䘏優典黄扉碩望名家子蚤歲鸞坡為學士浙水湯湯遺愛長膏雨芃陰頌盈耳帝眷閩疆節制崇妖氛倐煽自藩封鼙鼓遙翻鯨浪湧悲笳亂㸃仙霞烽憑凌殺氣千營接豕突狼奔攢劍㦸霜重夜寒刁斗驚慘澹愁雲黯吳越嗚呼忠貞誓靡他精魂貫日弗磨滅我皇掃蕩六合清烈烈大義芳且榮宸章璀璨勒珉碣昭回雲漢生光明君不見賁父捐生誌東魯陽瓚效貞流宋塢嗚呼忠貞岳牧柱石臣當危殉難尤莫伍褒忠墨本貽後人勵節鴻文載史譜懿典洋溢聖主恩恩實隆兮照今古瑤函芝簡十洲藏榻来墨瀋猶覼縷掌京畿道事陕西道監察御史臣成其範恭紀留衣表嵇紹之忠曽聞晉史握節稱李憕之烈載見唐書然未有御藻寵褒奎章煥灑如今皇上之䘏范忠貞既親書隧道之碑而又以墨本賜其家為振古褒忠者所未曽有也其範沐手展觀之下謹系一絶為頌云天上褒題地下忠九原含笑歇悲風他年為問司農笏更覺傳家勝鄭公江南道監察御史臣鄭為旭謹跋伏讀御書范忠貞碑文而知朝廷哀榮之典極備矣忠貞總督七閩甫蒞治突值耿逆之變此時如一木之引千鈞其勢實難久立因卒遇害古人有言曰臣竭其股肱之力加之以忠貞其濟君之靈也不濟則以死繼之公之灼見久已及此不在幽繫三年後也然忠者民之望也宋西夏之難劉平任福以身殉國中頰絶㗋皆所不顧敵因是不敢踐環慶南儂之亂孔宗旦不受官趙師旦曹覲皆死綏賊未幾就平今公難至見節閩雖僻處海隅其臣民不無思忠慕義者卒之耿逆授首南服宴然非公忠義之氣有以激之耶身可亡而志不可奪骨可碎而氣不可摧公生氣凜凜如在也况乎天章雲漢尤終古不可磨滅者乎謹拜手識于後御史臣許三禮敬識范忠貞盡節閩土皇上恩䘏倍至賜諡勒珉親灑宸翰勒成石本其嗣子時崇廣為徴求以彰國恩三禮捧閱盥讀書法精遒文詞愷篤既仰睿聖之亶聰復幸藎臣之食報而于皇上崇有功風有位之深意不覺更有所感也寅卯之間小醜陸梁東南騷動省有逆豎海有逋誅忠貞以孤臣處之三山僊霞隔絶京師五千餘里郵章稽達内外受制卒堅忍不屈王師北至密圖克復事洩遂爾被害真煩寃毒慘可為風雨朝昬鬼神夜泣者也獨是自古効能疆埸者代不乏人而或事後追思或請陳待䘏孰若忠貞之生膺特畀殁受殊榮者為雖死而不死乎是可以體皇上之深意也君聖臣忠千載而一遇也夫爰為之頌曰猗歟我皇天縱首出富有日新大業盛徳宵旰萬幾暇事翰墨宋􅖩晉書顔筋桞骨煥乎文章揆哉武烈聽政彌勤知人則哲維臣有范特授麾鉞兩浙七閩東南半壁桄榔雲漫黒山峰裂正氣不回丹心碧血王師桓桓一掃狐穴天子曰都卓哉臣節䘏典加崇朕心猶惻璀璨龍文淋漓珉石為死者榮為生者則忠節大義昭昭若掲拜手披詞用揚宸蹟掌山東道事監察御史臣劉超凡伏讀宸翰褒忠碑恭紀閩海狂瀾起吁嗟白日昬何人曽罵賊開府獨酬恩碧血留臣節丹心繼相門至今瞻寳翰長此慰忠魂户部員外郎臣劉維烈恭頌御製范忠貞碑五言近體二首其一臣道千秋立真成一代名丹心懸皎日青史著生平化鶴歸華表騎箕上玊京烈風吹碧落猶作白虹横其二不變萇𢎞血孤魂松栢悲皇仁優賜䘏宸藻自題碑世世藏丹篆年年泣露葵平原標大節後學仰芳規陜西道監察御史臣劉維禎伏讀御製范忠貞公碑文恭紀昭代生良佐啓疆萃嶽英金鉉繩榖似玊筍蔚王楨藜閣窺書古蒿庭侍禁誠膺符綏七閩秉鉞擅三征㑹見鯨波靖旋逢鱷孽萌血飛舌愈厲齒盡目猶瞪白刃吾甘蹈丹心那可更天戈忽南指狂豎即牽纓狡狡此苞蘖纍纍皆壁鼪帝聞深震悼士論重盱衡優典頒三省殊榮慰九京爰揮宸翰藻長使汗青嶸蝌字碑生綠龍文琰比晶疾風知勁艸寒歲辨松菁咄咄古貞士稜稜身後名煒哉注銀管仰止范忠貞掌山西道監察御史臣劉光美伏讀御製褒忠碑文恭紀二十韻國初有名相宻勿翊先皇勲猷載史䇿姓字埀旂常令子起科目忠孝率義方詞藻冠丹陛天衢瞻翺翔七閩古南服邈焉鄰海洋旬宣任不易特簡咨賢良時惟清白裔建旄振紀綱逆藩頓負國變亂勢猖狂孤臣義不屈仗節肅清霜不與賊共立頸血濺帷裳以此報君父一身殉封疆天子重名節情倍為公傷䘏典異常格泉壤應徜徉褒忠灑宸翰雲漢傳天章命工勒貞珉輝煌馬鬛旁御書流睿藻琬琰同珍藏鴻篇逼典誥筆力高鍾王大義托千古啓讀文字香一感主恩厚一念世澤長㣲臣愧弇陋蕪言附頌颺貴州道監察御史臣劉安國恭紀景運正中天潢池突小醜智勇復巖疆忠貞乃陽九閩海氛氣侵螺山精英剖元臣翼皇輿胄子修二酉出入金玊廬俯仰東南畆聖恩優以渥輿情洽亦厚逆孽忽異心孤注誰與守王章頃刻焚虛焰騰空走罵賊恨無聲嚼舌血沸口縲絏任其攣頭面聽其垢蜜語與螫言既脅復以誘百折欲生降一心終不苟義雖從容臨難實慷慨負捐軀闔室同執節三年久煤筆冩精誠熱血淋漓嘔命討罪人得褒忠難臣首宸翰燦天章諡贈光泉牖墨摹淳化題敕惟貞觀手汗青昭億代天壤埀不朽臣馮雲驌伏讀御書范忠貞碑恭紀天章璀璨下雲衢崇奬孤忠御墨濡卓哉忠清照青史正氣凜凜輕捐軀當時逆藩潛搆釁生民艸菅衣冠屠忠貞節鉞鎮閩海禍生肘腋遭羈拘寒暑載歴義不屈遺言畫壁光瑤珠忠魂直上呌閶闔魍魎瞬息膺天誅四海削平輯弓矢宸翰褒忠寵賚殊諡葬已優恩未殫穹碑詔立空山隅更頒墨本埀世寳臣忠主聖超唐虞小臣拜手忻展巻寸心感激懐區區臣梁欽搆恭紀古今大義幾能全千載孤芳姓字妍抗節顔卿舌不朽擊仇段實笏爭傳巖巖浩氣歸華表炳炳綸章繞御煙石上忠貞明月照徃来憑吊草芊芊臣翁祖望恭紀北望慇勤大節成丹心今日見忠貞從容就義承家學慷慨捐軀慰友生浙水波濤留去澤閩江潮汐漾孤旌琳瑯御藻良非偶麟閣行圖没後名臣嚴曾榘恭紀雲霄節鉞記當年日宇霜稜尚儼然淚墮峴山猶畏壘血濡閩嶠是忠阡家傳棨㦸臨雙闕言出絲綸賁九泉最是勾留留不得靈旗應繞聖湖邊臣岳峰秀恭紀矢死封疆社稷臣天收浩氣作星辰血揮杜宇依殘壘身畫麟臺照野燐兩浙澄清推孟博闔門忠孝想純仁龍章華表年年在開國元勲此荷薪臣羅衍嗣恭紀痛哭從容就義人龍章親灑慰孤臣貞魂永作河山重大節常依翰墨新鶴羽千年城郭舊鴻文萬古汗青真應知聖藻忠魂捧常傍寒星拜紫宸臣馬光恭紀雙蟠龍璧勢巃嵸按部東甌節制雄大節千年同皎日孤臣萬里泣秋風星沈閩嶠嵐光碧劍躍潭津波影紅自是聖朝恩典厚一坏終古鬱葱葱臣卞永寧恭紀范忠貞為興邦望族朝宇名臣秉鉞東南遭罹閩變奮不顧軀以報寵遇純忠大節炳若日星皇上特製碑文親揮翰墨俾厥嗣世世守之勿隕家聲臣展誦之餘彌深觀感恭題二律用代賡颺其一天挺孤忠著海嶠捐軀殉難樹風標窮年徒厪匡時慮一死能摧逆焰消越嶺金甌欣既固閩疆玊燭慶重調主恩特表純臣節御撰豐碑矗碧霄其二龍文御藻賜珍藏顯節旌忠意自長一代偉人光閥閱千秋盛典煥縑緗能將大義傳終古尤勝竒功紀太常碧血九原栖野草熒熒燐火有餘香臣沈三曽恭跋二律其一鼙鼓閩南撼海波孤臣厲節誓山河三年頻灑思君淚一劍長存正氣歌風急天高别勁翮歳寒木落識貞柯祗今畫壁留遺稿盥讀應知志未磨其二烈烈孤忠達闕庭鬱葱佳氣繞幽扄豐碑高峙懸霄漢宸藻親題麗日星五色銜書来窆穸千秋捫字識英靈蘭臺更有褒忠錄長使芳名照汗青臣劉元慧恭頌御賜范忠貞褒忠宸翰二律其一奎横雲漢倬天章烈節崇褒特表揚三載丹心懸日月千年碧血凜氷霜家聲不愧希文後世澤直同洛水長試向墓門瞻篆額龍螭五采發幽光其二聖主憐忠親灑詞數行鳳藻墨淋漓傳家鴻寳同彛鼎勵世良箴作鼓吹璚管揮成羲獻體銀鈎􅖩出晉唐碑欽哉有位宜交朂展巻披文百代師臣王思軾恭頌宸翰褒忠近體二首其一世臣開府鎮巖疆浩氣直同日月光閩海洪濤皆碧血墓門高碣自青霜煌煌御製鐫金石燦燦雲章勒表坊文正忠宣真不愧旂常萬祀姓名香其二龍章五色下彤墀俯覽忠臣就義時厯日寢興懐帝闕元辰拜舞儼朝儀從容逆覩燃臍焰忼慨還留正氣詞千古世家光國牒嶙峋大節著豐碑臣任玥恭頌宸翰褒忠近體二首其一名臣仗鉞鎮巖疆文正忠宣世徳長但矢一心能報王旋看萬國盡来王煌煌宸藻懸清漢烈烈孤懐塞大荒從此衆星環北極賡歌朝右慶明良其二聖主臨軒教澤新忠貞䇿效自天人平居若不求無愧臨事何能决致身頂踵易捐惟戴日絲綸叠錫獨憐臣瑤函瞻拜應知感况復振繩是鳳麟臣單務孜恭紀今皇文武神聖俱搏挽六合登唐虞英賢應運歸駕馭左旦右奭相匡扶文肅有子官司馬節鉞逺鎮無諸都長蛇封豕伏肘腋磨牙吮血恣刲屠幾人䝉面甘屈膝惟公臨難終不渝刀鋸在前衣食絶艱貞三載囹圄拘荻灰畫壁紀始末寸心忠孝常區區精金百煉光煜爚松栢肯隨凡卉枯成仁取義素志遂天戈迅掃反側徒公之大節懸日月九重軫悼哀榮殊忠貞易名晉崇秩天章宸翰輝龜趺羲爻堯典供㸃竄龍跳虎臥親臨摹復將墨本俾世守激勸頑懦埀楷模小臣再拜欣寓目雲光虹影驚盤紆片言榮過九罭衮隻字重若百琲珠願爾子孫永寳此世世忠君念祖匡皇圖臣顧祖榮恭識宸翰褒忠碑御藻題貞碣純臣沭異恩褒忠元自渥大義獨能存舊憶當年事今從身後論江鄉人戴徳閩嶠士瞻尊腥海澄千島甘霖綠萬村如何驕鱷沸竟爾黒雲昬正氣氷霜雨孤懐日月掀王師良壯武小豎早前奔白水流芳澤青燐照烈魂帝心深有恫天詔倍加温䘏詔傳三殿恩綸下九閽琅函飛寳墨珉石鐫香痕百爾官同職千秋節共敦颺言慚下里實忝侍金門臣紀愈恭頌宸翰褒忠十二韻元老騎箕日閩疆峻節傳乾坤鍾正氣竹帛景高賢樽俎鯨波靜綱維庶職宣清風標黼座偉畧振樓船倚毗殊恩渥氷霜雅志全忠因貞倍烈操以久彌堅智勇歸霄漢勲名上簡編天章輝寳册宸翰灑瑤箋琬琰埀千載貞珉勒億年易名馨國牒草聖賁幽阡山斗儀型重旂常譽望專盛朝多異數凖擬繪凌煙臣盛符升恭頌御製范忠貞碑排律十六韻一代綱維重千秋浩氣全成仁因取義希聖自齊賢慷慨完生死艱難歴歲年精神歸碧落姓氏勒瑤鐫撻伐張三嶺幽忠慰九泉鶴言聞華表鳥篆立京阡灑玊埀宸翰搴珠出大篇瓊章方掞藻銀籕復霏煙加以泥封貴長將石碣傳飾終昭異數念舊喜光前特遡名臣後相推烈士先綸扉綿燕許斧屋賁鸞牋列㦸門尤峻銘鍾賞更延家由唐杜迥人向日星懸堅白留彤史丹青照玊編清風挾英爽常傍五雲邊臣吳晟恭作宸翰褒忠頌十二章章四句黒風播海七閩成淵沭猴冠帶鬼立黄天一砥柱横流督臣孑身白日照肝噫氣星辰二閩山空高閩江空深力不勝胆吞賊人心三眼穿落日三年臥薪于于徐徐殺身成仁四氣作長虹徃穿賊壘隂翼王師縛賊如豕五王師一入轉坤旋乾逆骨舂粉凶臍竈烟六赫赫我皇允睿有嚴無忠不表無賊不殱七司農一笏為驅馳先紀功元祀汾陽比肩八白雲其曇白髪其鬖為招公魂歸自閩南九歸来華表青天白鶴琬琰龍章天子所作十壽不在年千秋為終越湖絜清閩疆死忠十一兩地立祠栢色最古父老椎牲考鐘伐鼓十二臣梅鋗恭紀猗惟忠貞天挺英喆相門有子令聞蚤發敡歴華省海邦建節逆豎披猖國榦霣折秀實不回杲卿比烈蹈義成仁帝命有赫飾終易名恩禮殊絶用激頑懦埀光史册凡百有位視此豐碣湖廣道監察御史臣都甫恭紀元精委萃靈秀融結應期符運乃生名哲藴為徳義植為志節發為文章著為功烈少焉頴異長益迥絶孝友天植宇量端凝言必忠信行必凖繩夙官中宻謨猷是陳臯䕫周召稱社稷臣金魚玊帶開府兩浙鐵面氷心囂淳貪潔吏治澄清羣黎載悦幽谷窮簷皎如日徹總督閩嶠逆藩弄兵變生不測援桴無聲抗身罵賊傍若無人忼慨殉難上報朝廷忠貞大節永埀汗青臣吳涵恭頌皇清受命奄一寰宇歴歲三紀覿文匿武天保在廷采薇邊土社鼠城狐忽焉豺虎惟兹赫赫總制范公不懾賊威甘陷賊中為忠烈死無文成功於戲傷哉乃時之窮天子明明整我師旅電掃霆摧七閩具舉維巴與蜀滇黔及楚次第削平純忠褒敘殊恩優渥古罕厥侣帝猶念哉一坏何所親揮宸翰豐石崔嵬雲漢為章幽㝠斯開賜書所在有光燭台而况貞珉不與刼灰千秋聖筆延陵十字何如斯碣徳位竝至貞觀御墨不留魏徴猗歟偉哉萬古獨稱禮部祠祭司員外郎臣師若琪恭讀御書范忠貞公碑文為賦紅螺行紅螺青青青未了日月高懸天皎皎鸞迴鳳翥字通神傳是宸翰親揮忠貞表忠貞家世元臣子鐘鼓清切禁林裏澤國初膺節鉞時逆臣賊子正干紀氛連六詔接交廣深山魑魅雜魍魎九龍江上走鯨鯢仙霞嶺外烽千丈段秀實笏常山舌氷窖寒持蘇武節寸灰畫壁壁痕深畫畫畫出孤臣血欃槍迅掃清狐鼠遺藁猶存達廟宇詩巻長留天地間丹心一片置何許㣲臣備員南省郎目擊䘏典何焜煌珠襦玊匣遙相望峴山松檟森成行高㟁深谷此石碣萬歲千秋字不滅户部員外臣趙吉士恭紀皇帝御極之二十一年削平禍亂朝野穆清九州之内罔不来庭逺而至于邊陬極壤不毛不食之地咸歸版章一草一木靈蠢蠕動皆沭聖朝雨露帝念惟昔閩逆薦驕守兹土者遭其憯衊總督全省兵部侍郎范承謨罹禍尤酷既命官致祭錫之諡典又以所褒忠之碑親灑宸翰天章烜煌光于墓道摹榻鴻文勒諸貞珉以示四方以勵有位其真本復裝潢成帙俾范氏子孫世世保之勿替皇上之所以教天下萬世以忠國愛君之道者洵深且厚視唐宋君臣飛白御書奎章秘閣誠不足儗其萬一為之後者固必恪恭自朂以荅天子之休諸在位者聞風興起有不克艱厥臣者乎二十四年春正月臣吉士獲觀御書于其嗣爰拜手稽首而作頌曰天生偉人幸際昌時惟帝念之生為屏藩殁為忠貞惟帝矜之䘏典煌煌既尸祝之又誥誡之龍文星燦奕耀豐碑緗帙埀之文思致治勸忠作新于時見之凡我有位必敬必恭庶幾似之於千萬年玊燭和調永言保之户部主事臣吳升東仰觀宸翰褒忠碑恭紀褒節旌忠朝廷之鉅典易名錫廕臣子之殊榮於惟忠貞慘遭閩難正氣能參天地精誠可泣鬼神特賁隆恩欽錫異數王言如綍恍聞玊振而金聲御墨如綸展也龍㳺而鳳舞千秋既壽以貞珉佇見亷頑立懦什襲仍藏諸巨室何如胙土分茅本支之銜感無涯瞻仰之激揚倍切户部清吏司主事臣林麟焻恭紀忠貞節鉞蒞閩之初值逆謀思逞之日勢孤寡援惟以鞠躬自勵麟焻知閩難將作脱身虎口間道走豫章得達京邸備員西清迨閩逆削平復以讀禮言歸詢里中父老得公死事狀甚悉當耿逆既變憚公威惠素著殺之恐失民望故繫而脅之幽囚三載艱貞有如一日及王師歴仙霞賊勢窮蹙將面縛乞降乃殺公以滅口公視死如歸從容北向稽首遂延頸瞑目不復他言嗟乎兇焰方張荼毒亦何所不至士人不幸偶逢其㑹能挺身殉國固不乏人然未有忼慨成仁殺身就義如忠貞之兼而有之也事平天子念死事之臣槩加優䘏獨于公勒石之文復親灑宸翰以榮之豈于忠貞有私乎哉葢任尤重死尤烈故典加隆恩加厚耳因以風勵之大指合乎人情之共安凡百有位諒亦有感于斯也刑部貴州清吏司員外郎臣謝于道仰觀宸翰褒忠碑恭賦聖主旌忠播八荒碑文御製出巖廊長令節義貞珉石不翅勲名䇿太常百錬精鋼綿地軸九重寳翰煥天章虛無縹𣺌松楸路奕世昭回日月光臣畢忠吉讀御製褒忠碑文恭賦重臣矢節在南荒閩海仙霞道路長功比真卿封魯郡忠如許逺守睢陽貞魂自壯山河色正氣常扶日月光赴義捐生堪報國九重恩䘏有鴻章臣馮宿榮恭紀恩䘏范忠貞盡節閩疆里言二首其一從来正氣貫虹霓况復三年縶曲罤蘇武豈能留海外真卿原解死淮西孤臣殉國心如石天子旌門手自題試看遺骸留瘞處豐碑百尺與天齊其二半壁東南一柱撑可堪負乘妄憑陵馬臨險地繮猶繫日麗中天海自澄三載小樓容信國一朝碧血𦵏萇𢎞宸章標處丹青濕爭覩龍文蜿蜿升臣戴璽恭讀宸翰褒忠碑文敬賦河山壯氣倚崆峒身隕巖疆志節雄絶脰捐軀皆帝徳握拳透爪是臣忠千年血化萇𢎞碧五夜花啼杜宇紅賜塚祁連恩不淺奎章照耀徹幽宫臣朱典恭跋御賜褒忠册後節著巖疆青史芳忠貞幽隧更輝煌蟠螭已荷褒揚盛緹帙還期世守長玊藻瓊敷光寳翰龍㳺鳳舞煥天章君臣恩義超千古選愞知興詎可量臣劉始恢伏讀御製范忠貞碑文恭賦變起無諸海氣昏强支一木誓酬恩但憑碧血驅羣盗敢望丹書慰九原御墨忽頒雲漢表豐碑長竝日星存聖朝旌節超千古為念純忠出相門臣陸鍾吕仰觀宸翰褒忠碑恭紀一朝盛典煥新綸史筆千秋正氣申蛟海鯨波迷舊履疾風勁草見純臣龍煤鳳管良非偶鐵畫銀鈎若有神聖主追崇真異數九原朽骨若為嚬臣徐必遴恭紀御製范忠貞碑文後其一嶽降精靈如甫申海天彈壓正需人朝廷南顧股肱地仗節全憑社稷臣其二滇南封豕抗王師順逆人人皆盡知獨恨庸奴聽邪説也將螳臂向天支其三從来矢報鞠臣躬紈袴無端敢自雄希烈不知朝夕死横加白刃向顔公其四大師指顧度仙霞簞食壺漿百萬家遲爾釡中方悔泣忠魂字字可勝嗟其五千秋節烈配烝嘗豈獨東閩祀一方大典旌忠從日下偷生若輩盡顔藏其六賜来宸翰麗如雲傳頌天章迥不羣不是臣忠堪贊許人間難得至尊文臣李含春恭跋列㦸通侯第開牙司馬門壯懐涵宇宙妙畧裕乾坤閩嶠妖氛起甌池濁浪昏亡身存大節嚼齒荅殊恩草木仁風逺河山正氣存秋濤精衛恨春雨杜鵑魂廟算高神禹雄圖奠六坤褒忠榮典册加禮貴璵璠龍鳳天章賁雲霞寳翰尊豐碑從此樹應慰未招魂臣郭茂泰恭跋惟公身許國半壁藉維持馭叱錢唐坂車褰閩越帷逆氛来肘腋生氣凜鬚眉倉卒難為日從容就義時臣心留壁稿帝眷勒豐碑片石輝宸翰千秋偉烈埀臣顧汧恭紀大節昭埀日月旁君恩賜䘏異尋常鴻文直竝貞珉永麟筆親揮墨瀋香遺愛甘棠留澤國孤忠寒栢􅀈清霜珍藏豈獨榮家乘秘館流為史册光臣姚諧恭紀遙懐大節望遙天閩水蒼茫入淡烟自古窮荒多小醜由来盛世出名賢彩毫雲漢承恩下錦石圭璋累葉傳千載豐碑依墓土亭亭璀璨慰重泉臣李文逺恭紀取義成仁原不殁疾風勁草豈貪生横戈逆賊空三窟仗節忠魂賁九京白刃捐軀無再計旌章䘏死有餘榮欃槍久掃天街靜氣作山河壯太平臣李孔嘉恭紀黄雲壓日閃旌旗狐火俄驚羽檄馳長虹曉挂將軍樹封豕宵昏下瀨師一㸃丹心持玊節九重紫綍勒穹碑睢陽大義千秋在瞻仰遺風慰所思臣徐元珙恭題絶句二首其一宸翰褒忠慰九京從容忼慨節彌貞海濤亭畔天風烈雷雨時時吼不平其二之死靡他報主恩幽囚迫脅地天昏一身百折傳千古睿製能招少保魂范忠貞集巻八
