body:
  text: 范忠貞集巻五清苑劉可書編百苦吟自序大地有苦海焉能溺人亦能成人吾輩胷具至性履險不渝一身之苦樂夫何足計惟是古今正人哲士雖當顛沛憂患咏歌見志往往牢騷感憤必於詩焉發之吳門嵇子留山天下士也與予以道誼稱莫逆交生平氣節初未嘗以境之苦樂易其心葢予之信嵇子亦猶嵇子之信予也癸丑秋從予入閩未數月而予遭異變嵇子與三山林子能任㑹稽王子幼譽華亭沈子天成同罹其難閱今兩載餘矣嵇子於困鬱中游戲筆墨作百苦七言絶句而三子依韻答和予讀之不禁泫然心悲竊自嘆不辰既上弗克酬君父之恩下莫能慰蒼生之望而又累我知交如此毎一念至何以為情故自被難時水漿不入口者旬餘日求一死以明方寸今奄奄一息復何心於筆墨但以諸子無辜受累率爾勉和附錄篇末畧誌一時同難之情使後人知吾輩之咏歌各有所屬非第為一身之苦樂而已也予之未出苦海者惟以有負於君有負於親而且有負於知交為有生莫大之恨事黙黙此心萬刼不磨又豈筆墨之所能罄也哉康熙丙辰初夏三韓髠翁謹識􅄓風龍怒神嗔風雨旋蛟宮社樹舞城顛孤臣何幸邀天顧獨剰床頭百瓦椽瘴雨烏雲漠漠四山横簷溜潺潺堦水平牀底湯湯鳴活活虚舟蕩蕩泛蓬瀛積潦濃隂含雨恨難收扶杖堦除數破漚滴滴心頭猶未死驂龍挐霧舞吳鈎炎蒸地蒸天炙煉朱顔一寸光明鈍鐵頑任炙不焦蒸不爛渾淪夭矯碧空間凍雪徹夜氷魂屢暗驚乾坤何事靜無聲霏霏碎玉光難滅馥馥寒梅味更清連隂鼻鼽胸脹氣如蒸泥汗淋漓餓眼瞢宿霧荒烟吹不斷淒淒無語枕癯肱霉濕乍晴乍雨幻無邊燥濕薫陶色相鮮苑囿髙低鋪紫􅂒床楹日夜長青錢泥濘霏霏雨雪幾曾休木套縱横踏淺流滿眼汚泥呼杲日速舒烈熖灼盲鰍昏黑落日昏沈歸暮鴉紛紛羣動月光斜人我相冺須臾靜尀奈鄰溝呌夜蛙昧旦雞鳴驚起索朝冠先向慈幃問蚤安往事已非腸斷絶淚珠空浸枕痕丹瞭燈銀燈照壁繪梅根榾柮槎枒墨鐵痕爾莫咨嗟予影瘦清風揺曳向天翻屋漏椽檁稀疎瓦不均最宜仰臥數星辰無端每值更深雨四處霪霪徙坐頻濕地諸葛當年入不毛七擒七縱耀弓刀不才誤主緣秦晉滿屋沙泥手自淘負暄兀坐窗間曝曉光須臾乾盡草頭霜圜中佇看東風面玉樹氷珠放早香旱澡垢膩纍堆豕負塗徘徊難語向天吁羞從旱魃求漿水搓箇泥丸彈小鼩蓬首亂雲凝結九秋霜半尺銀絲百丈光膏沐未施嫫母笑心甘披髮豈佯狂垢面攬鏡驚看瘦骨微依稀曾識又疑非由他滿面灰塵厚盡掬長江賴故衣攣手走老科塲兒倒綳鯤鵬潦倒困鼯鼪辛勤珍重屠龍手跨海長鯨劍底明縶足被謫仙蛾痛撫膺羸軀重載九層氷寂然黙演周天數枉費村牛綰赤繩拘項多生夙業巧還償香骨錚錚縲絏光天意若囘離貫索借纒梟獍助烝嘗枯腸早步青雲喪此生天人學貫亦虛名誰知靖節懸琴意識趣何勞絃上音淚眼泣涕三年暗曙星亭亭日午尚疑冥幾時一吸鯨鮫血銀海光揺兩炬熒聞柝梆鈴闗柝備皆空暴客翻持禦至公休笑貔貅顛倒用從來盜憎主人翁聽砧春風蕩漾送秋砧四野凄其怨語深已恨羈魂難閉耳爭禁􅄔婦碎敲心鄰哭天步艱難運氣屯狐狸號喊虎狼嗔既憐我舍哀生我又痛鄰家哭死人風鶴連年笑我獨含悲何事狂且也皺眉佇望三山繁草木鼙聲隱隱耀旌旗砲警大地崩頽海沸驚鐵龍飛舞血花生頑㝠猶逞貪痴興笑比元宵爆竹聲觱篥愁雲黯黯墨光深日夜城頭哀角音孤客旁皇難夢寐繁寃吹起鬢霜侵鼙鼓寂靜山河三載悲觸翻雄氣向天吹漫誇晉鄙軍聲壯虎帳曾嘗屠狗椎笳吹沙漠秋清響塞笳文姬漫譜冩離家蠻荒炎日鳴螺貝蘇子題詩送落霞吏稽聞道狸奴㸃士名勸君髙應莫心怦即今預擬朝金殿只當傳臚第一聲卒獰狐嘻嘻燕雀歡牛襟馬裾沐猴冠盍看溷底水仙子出没如何咬磨盤晝詰隂森凄慘久無天鬼卒嗷嗷井底蜎佇望三山迎曉日犁翻蛟穴啓桑田夜查黒風飄墜海中間羅刹更深檢大環漫謝諸君能効命助予功遂玉門闗值班一羣纔去一羣過横者猙獰達者和徐唤同儕觀後沼霜風昨夜捲殘荷交更催更漏箭頗分明狂猘偏多怒吠爭睡早睡遲惟頃刻自家窩裏亦無情臭蟲逺瞰氷肌亦可休偏恣吮嚙逞風流燃燈一指須臾盡遺臭髙名萬古留蟣蝨么䯢腋胯度朝昏世務難譚且漫捫項直手攣難擺佈留君幾日處殘褌飛蠅不住深宫警聖賢欣嘗厠穢逐腥羶白圭莫惹些微垢塵拂髙擎握老拳遊鼠牙鼠何堪也自雄跳梁竄瓦日當中那知衆怒終難犯看爾臨時五技窮聚蚊餘血難供一飽餐徒勞歌舞未成歡貞姬寧露神筋骨况我書生肉更酸鬼啾從來知有鬼神理今日忽聞鬼哭聲鬼若有靈攜我去願偕衆鬼噉梟睛疫癘肉盡皮穿心已灰驚聞難侣悉生災籲天早碎孤臣骨留得羣英濟後來碎衣宮衣新著舞萊衣矢報君親天下肥詎料裹予成鬼瘦機絲片片伴花飛破被敗絮朝朝雪滿氊大如手掌軟如綿凌霄片片天鵝羽笑爾蝦蟆眼自穿砂鍋温羮烹茗更燒湯急急煎煎沸沸忙無異臨塲新子弟旦生丑末一身妝泥罏玉屑霏霏手足龜圜中安得有烏銀生平自信如冬日羞捧泥罏煖凍燐瓦盆鄰兒長歎斂雙眉陶器如何撞鐵鼒已破不須增顧悵古人垂戒預操持草褥稜層榻板瘠腰臀那得温柔稻草痕煩檢香根勤洗濯藉予待罪大清門敝履當年踏遍越山川急拯民艱屐數穿閩困未蘇鳬折羽子喬無計更朝天破枕漆園已覺枕難抛夜夜遊仙透露梢久擬追隨黄鶴後梧桐月下賦敲交篾筐竹筐拳大漫吁嗟中貯松毛栢子芽蠻地借熏除瘴疫還期蓬島採金花竹刀仙家夢授一氷桃縱不成仙亦足豪堪笑鐵圍叢狡黠横操竹片舞邠刀草珠心光早已摩尼圓不坐西方九品蓮緣係現身來説法毘耶重覔草珠穿油箑三年懷握引清䬞字紙參差糨飯髙非是故人曾半面獨憐向義勝綈袍憶紙昔曾簪筆染龍箋豈料身居弱水船欲冩新愁無寸紙燕釵屋漏血痕鮮憶墨未盡灰餘亦可憎曲蟠牆角鬼神憑幾囘夜半來風雨誤認僧繇壁欲騰憶筆中山􅊵子被狼吞骨肉飄零絶五倫幸遇烏龍能代職牢騷犴狴補天根憶硯不親羲獻已多年潦倒參苓典簿錢為惡奸雄銅雀瓦眼前更欠綠泥磚殘厯將來萬有一時中四壁蕭蕭兩腋風留得天頒書一巻毎逢朔旦效呼嵩炭痕稀疎慘澹復縱横塗紙汚牆若墨黥月下杜鵑揺素影一團碧血一團聲塵灰改嵗家家塵垢飛獄中也縛草枝揮禁之不可憑伊興冷眼看他土面肥煙眯朦朧雙眼醒還迷晩爨鄰烟擾坐栖勉強扶笻出戸坐斜陽逺隔碧峰西乏水江南冀北任遨遊吸盡名泉甘露浮閩海那知逢烈焰惟求天雨潤枯喉滅火金爐灰冷亦虛供兩耳蛛絲密密封靜待青蛇復蜿蜒重隂剝盡栢香濃摘菜菜根咬得是賢豪剔蠧搜泥自煮熬此處佳蔬滋味别苦𤓰間頓癩蔔萄執爨巧婦曾愁無米炊錚錚男子痛燃眉捉襟露肘真前鑑村女心知猶強為食淡口内由來氣味清鹺規人嘆業全更始知上古強兵術煮海須教淡養生縫綻破袴頻招風雪侵強為兒女倒金鍼未曾乞得天孫巧絲線纔穿指血淋浣衣衣絲汗煮汚同塵澣濯何曾為爾頻垢膩雖髙吾敝袴且留片段蔽羸身粉粥展轉無眠病莩俘饑腸雷吼鬼揶揄不知粉粥如何味半盞姜湯勝酪酥餿飯餿粥三旬啖半鐺苦懷難遂豈圖生偷兒莫浪稱周粟據我貲囊餽我羮柳茶嘗遍人間萬種茶龍團抛棄不為嗟年來諳盡泥漿味翻憶清辛嫩柳芽劣酒對酒悲多萬緒牽老兵勸進穩愁眠入唇不用逃蘇晉飽諳諸方五味禪缺藥生平孱弱藥為糧罹難何曾片滴嘗病不脱身命不絶天留殘質砥愚狂書傭飛龍羽翼各西東顔色暌違夢寐通時有鱗鴻傳近况拘攣疲指舞冬烘醫匠陳皮今已訛東尖桔梗枯枚態更纖醫匠醫王憑業口猶如牛馬呼應兼偶有病者問藥塗壁示之故有此訛敝席敝席久已棄泥溝風雨凋殘剰半勾徐語傍人張後隅半遮臭氣半遮羞篐桶團圞陡被狡童隤棄置牆隅風雨摧惜器人來一舉手出民水火躋春臺糞草草莖土滓漸成堆愁鎖眉峰解不開為諭厮童連夜運門前髙築斬蛟臺穢厠溷聮犴狴勢憑陵食藥纔擎穢氣騰遥計㑹稽青冢上至今怒色響稜稜溺器藏足無頭縮頸龜夜闌晝永坐前遺從來獄卒輕人慣燃則溺之奚足嗤惡夢世情雲變久心傷那更連宵怪夢長劍㦸如霜鏑似雨青燐赤血滿沙塲哭友君雖先我喪無端猶有同心痛撫棺待我斷頭歸碧落只餘枯骨砥狂瀾哭僕愧我無才累汝亡兼貽同難斷愁腸英魂且莫離余側生死相將歸故鄉客俘俘客何堪問客俘衣冠狼藉眼糢糊可憐豚犬痴迷甚鳳鳥摧殘飼野鳬祭墩廊廟新培巨棟梁却輕殿陛棄椒房多應不樂人間世改貌希予絶覆藏又魚肉蒼黎困俊英婆娑蹲踞影彭亨祝君早供三軍爨好了從前無限情吞蠆悮忪一毒舌根長不救斯須命即亡今既入腸湯沃雪諸家本草謾商量嘆鼠兩鼠跳梁上一墮地死一充猫腹穴中兩鼠謾相將拚命超騰競墮梁縱是武安屋瓦振青霄明月自天閶雪異入夏甚寒驚傳郊外大雪越數日有人折來芙蓉兩枝光潔榮茂亦可駭也嵗前臘瑞已心驚夏日何來碎玉英蠢爾蜉蝣僵欲死皎然孤鶴唳松清葩妖節候輕移幻夢空祝融顛倒賣英雄蓮凝白雪纔鋪粉又放芙蓉弄淺紅祝茶頂禮潮音掉海槎攜來一掬淨瓶芽灑添半滴枝頭露潑滅炎天萬頃霞煮茗旗槍浥露拂煙斜汲井頻將活火加遥望福堂心供養趙州一盞綠雲花諭僕酸虀敗腐苦黄𤓰茹淡遥聞爭自嗟一擲千金豈爾輩何如攅聚買鹽花酗醉以下三首皆諭僕之詞中道如何頓異初顛狂傲慢蔑龍魚勸君速盼平南詔昧爽前頭縱赦除詬誶數代同炊義最親須知寒齒惜傷唇何如存養絲毫力罵賊誅仇佐主人格鬬季春田鼠化為鴽爾輩何心反變猪痴昧剛貪時悻悻自塗汚穢惹狂狙吿神黨禍曾羈先孟博直將讜論讓臯陶予今諂祭因求死好脱無辜烈俊髦覔炭同人共難苦離居一夜鵑啼百陣餘獨我聲銷血已盡强搜炭屑寄魚書老親生兒雖喜實憂深萬事牽纒萬里心既痛負君復痛死冀全忠孝費沈吟又伯兄舞象我方生十斛明珠掌上擎剛得宦婚情暫愜那知垂白百無成又少攜三弟誦詩書綵袖雙承笑語餘兒鬢已添銀線縷翻貽南望倚門閭長兄前年送弟渡桑乾話别酸辛判袂難此際滇中念母弟仙霞哭罷望長安蘇公我前南邁病新痊相送悽然囑早旋世事已非休望我三親獨賴汝身賢允公娶親聞汝詣金陵曾遣蒼頭荷擔簦自接維揚書信後至今只有淚沾膺彦公痛汝何當我共炊祖遺全供宦中資既煩悦母兼勞姪借劵無償更費思六弟弱骨支離汝倍寃先違老父繼慈萱未偕伉儷緣多病隻影㷀㷀急在原病室多病何曾解䌟纑那堪泣血憶征夫支持且莫沾床褥兒女嗷嗷累老姑又夢涉荒園坐舊閨松風獵獵草萋萋相看但訝顔非舊蓬首無言掩面啼兩兒莫讀詩書莫戴貂祖翁遺圃儘堪澆慇勤侍母休頑劣共孝霜婆樂暮朝吾宗數年未得聚昏晨甫到都門又海濱忽被腥蛟乗蜃氣歸來無計泣秋旻又太傅家風文正開簪纓黼黻響春雷養親教子各從舊莫向南荒作我哀舊遊臨安謁帝入長安夾路桃花一月看最是鳳城春色麗五雲繚繞捧金鑾感懷磨炭和百苦恰哭屈原時細檢無可取焚之還自疑欲寄何由寄收藏誰與持展轉勞夢寐一念百躊躇聊比御溝葉隨流付所知代為消烈焰了此一番癡范忠貞集巻五
