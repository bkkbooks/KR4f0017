body:
  text: 范忠貞集卷七清苑劉可書編雜著望江南人寂寞人去已難留十里荷花初出水意中倣佛只如秋蟬咽更無休人寂寞非醉也非狂腸斷新聲今日聽年年此際恨茫茫欲説與誰行又人寂寞無語耐清宵歌韻才隨愁裏歇鐘聲又向枕邊髙驚夢怨風驕人寂寞無夢倚疏櫺樹葉背翻新月白煙光橫散一天青雙鶴倚空庭又人寂寞斜月挂簷西長夜夢回天欲曙鶯聲平溜耳根齊牀下柳稍低人寂寞雲綻碧山東不捲珠簾籠曉日臥搖紈扇引清風心事總成空又人寂寞天燎不勝煩日散晚霞凝暮紫葉翻黃落舞輕痕佇望墨雲根人寂寞樓外數鳩鳴楊柳煙中迷四野芭蕉聲裏到三更陳陳向天明調寄蝶戀花西園霽月雨過雲斜晴欲溜點點淙淙滴滴西窗右何事關情難立久無情風墜新黃柳月色穿簾連濕透涼暈初圓不覺中秋後素影年年同浸酒相看只覺人非舊調寄踏莎行垜莊和壁間韻雨霽雲收亂流爭渡匆匆暫歇花間鋪微風帶出布簾斜短牆半壓桃花樹濁酒三杯整鞭速去踏春驕馬嘶香路及時功就賦歸來休休莫把韶光誤吳公像贊吾雖未識吳公而式觀其容粹然沖美外直中通惟厥子肖之觀其奏議如忠定公亦聞吳母頗有父風惟厥子承之愈色而婉容於戲天惠哲人暨于後亦奚異于其躬耶醫官沈耀文傳沈耀文字赤甫號恆全休文公遺系也公瓜綿椒衍閲數傳分居於浙之武林詩書禮樂車蓋簪纓不替世德焉至耀文自少習舉子業將以光前啓後緣志急濟時遂專意於紫苔玉版諸書以儒道而兼乎醫道其按脈則洞如觀火也其辨症則皎如列眉也其定壽夭而決死生則又不翅如蓍告而蔡卜也不惟浙之端請者足填戶外即晉楚燕齊之王公大人無不知有恆全先生其人者逺道幣聘冀得一接見為幸奕奕聲施與韓康郭文相雄長著有攝生指南集雖未授梨棗而抄傳者紙貴一時銓部稔聞轟名任以太醫院吏目時逢疫症流行捐資贈藥人賴得生不勝數大疫之後大荒復作比戶皆炊玉乃為粥於路待餓者而食之間有親友家不舉火者計口餽遺為謀全活而后即安人賴得生又不勝數他若施棺痊殣善事每不讓人直指使者王公廉其事旌閭題額謂仁德可風至如事父兄以孝友稱接里閈以謙和稱處閨閫以刑于稱訓子姪則又以寬嚴交著稱大約內不欺於寤寐外不愧於影衾言必忠信而後言行必篤敬而後行焉耳古云皇天無親常與善人故耀文既享髙年又裕賢嗣焉丈夫子五人皆紹世業而長君陛詔者制心制事一遵先人所為於世業尤為卓越余伯兄專閫括蒼延請幕中嗣偕之燕邸家相君亦藉以綿餘年故余備悉乃翁事因援筆而為之傳史氏曰人孰無恆心也哉余迹耀文行事內以全在已之恆因外以全濟物之恆自號為恆全子亦不過期全其固有者耳然世有乘得為之權而利欲中之致不克全者又有處困抑之遇而喪所守致不克全者何耀文能有以全其恆乃爾也耀文亦賢矣哉內祕書院學士范承謨撰沈孝婦傳孝婦姓張氏世為仁和之儒家少柔婉有令德通曲禮女孝經許字同邑沈耀文耀文有母宋氏素病頭風每發則岑岑然纍數日不起久之病大作里俗謂病者多災祲則以子弟之冠昏禳之吉事日增則災祲日消時孝婦甫十六遂與耀文成嘉禮孝婦未及修盥饋輒入侍湯藥目未嘗交睫衣未嘗解帶扶持必恭怡怡如也昏十有八日姑病將屬纊孝婦憂泣請於父母而卜之或曰不吉孝婦亦不聽夜禱於天請以身代且曰姑疾亟矣姑死我亦不欲生我聞股肉可愈親疾盍試諸即引刀刲其股流血殷襟袖間孝婦怡然不為戚為羮而進之姑已憒甚甫入咽神氣漸蘇醫者賀曰脈已復起得生機矣已而疾日退時姑夢大士同神人絳衣玉冠者自雲中下謂之曰若齡已盡汝婦大孝能格天心自今已往復延者十餘年姑驚寤以問侍疾者皆莫肯言病起乃得其詳姑愀然曰爾始離父母輒殘肢體以救吾是以吾而纍若也鄉里皆竊竊相驚羡或聞之於有司為揭楔而榜之曰沖姿竒孝云其後姑卒之年果符其所夢孝婦相耀文以仁德行於里閈稱長者人有困憊孝婦輒解簪珥以濟之閲四十年如一日也順治己亥孝婦後耀文一嵗卒其卒也趺坐而逝未嘗有疾焉噫以賢婦之孝行偕君子之仁風其昌家道繁子姓有由然哉史氏曰割股割肝古多有之然亦有驗有不驗夫天之祐善人以其誠孝耳非謂股肉有治疾之功也古之賢婦若薑龎者何限然亦與親周旋久未有若孝婦之始結其褵操刀而籲謂非天植之性而然哉其子嘗自傷貧賤不獲申母懿為恨夫世仁孝譬猶麟鳳之與芝醴也闡發幽芳表厥宅里非司風者之責而誰歸跋宋髙宗賜嶽武穆敕右宋髙宗所賜嶽武穆王敕也但書七月十二日而不書年未定為何時所賜觀其敕語似為經略中原時諄諄委任有心膂之寄雖光武之于馮鄧何以加兹豫以己酉至杭垂今五載每過西湖未嘗不瞻拜墓下邇者為公加護馬鬛兼裝潢遺容以垂奕世因念公之英靈炯炯于天地間者固無之而勿在也當日髙宗御墨流傳甚多悉已泯沒而此敕獨借公以傳千秋萬世存乎其人豈不信哉重修孤山放鶴亭記豫以六月之朔過西湖藕花盛開觸事感懷得詩十首其中一絶句蓋遊孤山訪七賢堂而作也又二十餘日道士何規中特繪此圖思移亭補梅築臺樹籬以侈湖山之勝豫既諾其所請許建放鶴亭于其側因憶大蘇昔遊赤壁夢一道士玄裳縞衣訝為疇昔之鶴今處士去逮五百餘年亭空無鶴而何道士適欲重葺孤山以復處士之舊安知即非鶴之所化為豫詩中華表之句又增一公案耶因笑題數語并附西湖詩十首于末壬子六月望後十日記考言録引首豫謬膺特簡撫兹兩浙地大事繁又適當水旱竒災民之幸免死亡者一間耳豫殫竭心力凡興利除害之事雖無大補于民然憂勞所積病已不支頃荷聖恩豫告因取在事以來奏疏咨移榜檄之屬擇其稍有關係者存之名曰考言録竊惟詢事考言自唐虞課吏其法已然然靜言庸違在當時已有不免于夸偽者後世仁言益工上告則鞠躬盡瘁過于諸葛下諭則視民如傷比於文王而考其本心與其成迹則有較然而不可掩於愚夫愚婦之耳目者豫以養疴之暇正省過之時他日取閲是編其或有言不由中以欺朝廷百姓者乎有徇名無實以博虛譽者乎其措之政事有似利而實害與利未盡興害未盡除者乎傳曰進思盡忠退思補過是録具在吾一一由所言以自考固不啻天威之儼臨而百姓之具贍也祭浙督趙公文嗚呼余與公始終未及一面也余童時即聞海內有君鄰先生為當代儀表筮仕以及今日垂二十年而未嘗一日通殷勤蓋徒為神奉也去嵗冬浙撫命下奉嚴檄戒途於今春仲抵省受事公正閲視海疆由閩而越月望抵寧之奉化奉化距省不數程余方遣一價以候行旌而公訃音至矣嗚呼余與公何始終不獲一面乎余陛辭時蒙皇帝面諭諄切夙夜怦怦深以不克負荷為憂復私計芳軌在前得以亦步亦趨而二十年來夢想之忱冀攄於一旦不謂余履任之期未幾即去公乘箕之日也寧不悲哉擬修楚些之詞而筆輒搖搖不忍下蓋幾為神傷也公厯任巖疆威惠並著得公者如得豐年失公者如失慈父卒之日巷空閭走軍民奔號之聲徹晝夜禮臣修勞臣故實行且器錫後園公亦可云無憾况乎碑傳南詔泪墮峴山遺愛在民豫亦何能更僕獨是浙當水陸衝衢疊更水旱民苦於賦吏病於貪兵逞於驕俗刁於訟余方望公左提右挈得借手以告臨軒而營頭星隕哲人云亡此東南半壁之失其禔福也而余以與公未及一面為於邑者其尚屬小人之見乎公靈爽在天其鑒余言以啓余哉募修紅螺山資福寺疏文經文東譯白馬所以開緣舍利西來赤烏因而建剎故日月燈常懸震旦而戒定慧遍啓晨昏眷言前輩之傳薪式賴後人之卓錫兹有懷柔縣紅螺山資福寺者地侔多寶樹擬雙林建于元之皇統初年新于明之正統丁巳四圍翠合晴嵐列作郭郛萬籟緣空夜氣平清市井千尋拔地而起異嶺共乎慈雲百丈接天以低同峯殊其化雨激飛泉于絶壁趵小沚于平階波走縈紋似繞白蓮之座響生滴􅅹如聞清唄之音以故飛錫雲翔乘杯河渡戒壇恆馥慧炬常明都人士選勝而臨善男女聮蹤以至窗舒意葉知禪性自悅山光室度心香覺塵慮都空潭影洵乎福地允矣慈航乃以日月不居因而滄桑遞變覩遺薪于處處知是樵採人來嘆蠨網之重重可惜辟塵珠去徒供煙雲之聚散誰憐水月之蒼茫某行李偶經假途適至投足知倦望剎情歸僧徒闐其無人榱棟毁而莫搆禮燈王于石室獅座塵封瞻梵帝于金龕燕泥梁落有觸於目遂感於心念此山靈豈無佛果必使金箆再照庶乎寶地重開顧雅慕東亭欲捨虎丘之宅而自憐貧女難轉法藏之輪力不克從勢須有借凡國將凡宰官凡初地居士念盡屬會裏之人或金錢或布粟或纓絡寶珠慨皆為身外之物去貪嗔想結歡喜緣但花座涌於意田何分阿育半殘之果苟寶月懸於眼界敢言長者布地之金與諸從者異哉螺山諸大比丘沙門行者之同罹陽九也殆亘古以來罕有其匹者乎既不如田橫之共死又不能如子卿之生還心朝斗闕日逐曦輪八百餘晨夕矣天戈象逺漁棹音乖庸臣敗子死有剩愆何敢復食息人間其所拳拳者惟此大衆言責官守絲末無關頗有可援之手可乘之機奈何棄此不圖乃硜硜苦節渺渺遙望坐待淪胥而不思奮飛耶豫意久蓄欲發正恐大衆不諒豫衷以為不識衆意故為斯言挑之有傷衆心吐而復茹者數四三載來堅白之操不惟可以貫金石亦可以格鬼神而光日月兹者興懷及此儼有神明默啓其衷諸大比丘當洗心靜聽切勿以為迂濶難行置之不見不聞也山農九峰亟慫恿之醉白老人世居榕城人所共知家有百齡之母日夜思古稀之兒想仁人孝子聞之亦必心痛當直具一呈云氏子某閩人也與前總督素非知交從無往來感彼誤聽人言謂某久厯幕府必練事故專員聘請誼不容却因而應召一經署中坐尚未暖其所陳請者不過因兵火之後民窮財盡亟應拯濟以養元氣何曾一語及他察律文七十以上罰則不及無辜遘難實堪憫惻詞復惻切則老人之出易如翻掌次則衣右須語義翁親赴山君諸處曉以大義教以救友云某忠義士也向在某府主人相待殊未異衆竟爾挺身共禍毫無怨言觀其不背舊主斷然不負新知顧人所以親禮之何如耳豈可久置囹圄摧殘善類耶或公舉于敝魚或私説于孽羽則衣右之出亦可計日而待二人倘脫即宜揚言于大庭廣衆曰督署幕客皆新聘諸生或稽錢穀或核刑名時而參酌尺牘章奏至於賓主晤語無非為救拔黎庶撫綏地方從無半語謀人乃俱置犴狴皂白不分必至盡死此地耶之數子者皆有用材也或録用或釋放上可以體天好生之仁下可以免妄殺無辜之謗且在獄諸人固其家生子然亦有其親友僕從隨主逺出撇父母離妻子已屬可憐乃復共遭羅網三年於兹使坐成瘐斃有何益乎何不按册而稽槩令削籍為民則渠等感激再生自能圖報况長隨諸人久經釋放曾有一人敢蒙異志乎何必槩填一房日費糧米復用多人防守乎如此以圖倘得寬縱天空海濶任其所適則豫之業緣亦可永斷矣幸切維之又與諸從者比丘誤矣比丘過矣蒙谷存亡何足介意豈忍以此廢質之安危動攪大衆之憂慮耶前之所賦為道其日之縈縈于懷者唯望法王如來佛力浩大元氣充勝四大堅強蕩除邪魔庶幾重覩金剛法幢耳近者風聞四路猖鬼攢惱虔心蒙谷福堂諒難再造因而心胸乾焦神魂震飛亟欲力行捷徑速與大衆作别一畢自身業緣次脫大衆苦海若任其優遊牽扯恐此一絲不肯當下了斷徒受火坑煎熬終無禆益也所患者獨以心病為劇今此肉軀無恙脾胃健壯大逾往昔然飲啖少進者乃故為樽節勒掯冀其蚤得羽化非弱也至於藥餌俱所不需若得心患一愈不惟枯腸遂而億兆蘇將見乾坤清寧日月光輝矣然烏能輕得而致之哉風聞之言虛實不一疑信亦半若有確音當明以告我諸大比丘安乎山農病已脫體乎懸切之極望俱示知范忠貞集卷七
