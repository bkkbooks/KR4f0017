body:
  text: 范忠貞集卷九清苑劉可書編挽歌哭范覲公少司馬死閩難魏象樞風髙范老舊家門血灑巖疆報國恩兩浙清名垂竹帛八閩正氣塞乾坤潮歸南海蛟龍泣月上東華劍履存青史千秋今日定九重早已鑒忠魂挽督閩范侍郎抗節殉難梁清標如公忠孝自家傳三嵗幽俘瘴海邊欲奉金甌還帝闕那堪鼙鼓動蠻天孤臣獨蹈危機日信史終書盡節年留得繐帷霜月冷幾回流涕武彛篇其二列戟門間劍珮虛握拳透爪更何如同仇幸有田橫客絶筆猶傳蘇武書萬里傷心摧羽翮九原遺恨矢鯨魚纍臣氣作山河壯夜夜忠魂繞玉除哭范覲公制府殉難李霨壁上何人字千行血淚深雲雷回世運金石鑄臣心厲鬼他生志明神此日臨魂招知易返夜繞白山岑其二浙水移風效閩天未雨謀徙薪時已晚裹革志終酬石立中流柱霜凌徑草秋有人藏碧血萬里慰松楸挽故中丞范覲公祖臺談宗五載深仁浙海填忽然鐫裂嚮閩天野夫隔面腸猶斷春草無心涕已漣痛毒天親垂觀闕從容大義滿詩篇不堪咿啞南歸鳥片片西風作杜鵑天道歌有小序洪士銘康熙丁巳七月十二驟聞閩舊撫軍劉秉政暴殂於是知有天道歌以志慨兼哭范覲公侍郎七月初旬若個熱正為孤臣著竒傑天公網漏終不疏地軸流分總歸轍隂陽倐變等煙雲隱睍飄消見雨雪虛空獨轆如轉輪冥漠相將有剞鍥去嵗方窺北斗髙今朝忽乘西風滅璇霄曩夜赤城霞璚宇千秋碧藏血前後數夜赤霞遍天南望之有鬱怒氣范緌不傍蟬冠榮耿介何如雉經決范公纍縶三年竟冠國冠以死介當讀為介紹之介尚方匣底龍猶鼾下里聲中泉已咽更憶狂颷酉旦吹旋驚怨氣辛旬結劉殂以酉日辛旬樞密競詡黑頭公樞密彼偽官名召記應羞白玉缺悔不同興秦國師無端却遜常山舌池頭樂奏暗傷心大窖旄零空仗節季布然諾今則無侯嬴祕計竟當折婦女肝腸儘不同男兒意氣遂輕裂閩變將萌藩母憤死變後婦女殉節較多于男縱恃移山勢欲旋應憐匹素情經涅三韓鶴唳海青飛七閩鵑啼猩紅啜冥路仙霞逢故人指范隂房鬼火繫新碣當年捩臂肯同心誤捩劉臂解出范公畫壁序轉瞬蛾眉猶可説嚶鳴恁弗附遷喬蜮影終甘潰蟻穴一劍酬恩雖則難偏言賣友亦何屑亦出范公自序清漳葉李咏歸遲捷徑終南勞計拙不識深淵厲揭人寧辭末路惜乾鱉昭昭不悟待鐘鳴汲汲垂休任井泄古昔捐生取義殷兹乃事讐銜恩蔑君親授命豈尋常近逺流芳爭耄耋五栁微風亦足師三年坐卧並非褻從來利鎖與名韁惟恣窮竒共叨餮盛世明良金鑑懸清時旻昊冰壺徹醇深不露丰稜全恥怍由中揚厲切象鼎神姦各賦形燃犀鬼物奚遺孽睢陽為厲本滅賊檜樹名同終受批莫訝循環天道疾胥由倚伏人謀抉平居幸念矢忠貞際變須存好轟烈千秋正氣幾長歌械鎖香吹尤冠絶食祿投艱引避難傾人利已回身畷朝家待士豈云薄海屋輸誠胡自别豪俠姦頑等性成龍鱗虺蜴並天設填胸請質武夷君偕作雄風歌駟驖咫尺寒威搖五嶽星河洗盡欃槍滅武彛閩名山有神曰武彛君范公蒙難以來有泰寧人許鼎為耿將校心義范公每扶掖照護之公作武彛曲以贈之哭少司馬范覲公制府閩變死節三韓朱士傑慷慨勤王檄昻藏正氣歌竟投夸父杖遺恨魯陽戈扼吭生何有穿齦憤不磨武彛堪並峙千古共嵯峨其二逆賊終須滅椎心失杲卿三年士論定一死相門榮天網非疏漏人情急蕩平睢陽遺事在青簡照孤檠聞變遙哭制府范侍郎許旭天道茫茫理數微英雄詎忍託知幾提矛躍馬心何壯破浪乘風事已非家國有懷天地隔干戈莫定信音稀三千里內家家哭豈獨浪江一布衣其二迢遞關河斷雁鴻傷心無限夕陽紅回思草檄停杯處已是橫刀喋血中兩月便從生死隔三山無復笑言同摩挲燭畔看靴刃一哭今宵寄北風其三仙霞井畔路漫漫遙望天南涕淚殘坂折驚心方躑躅機危間髮敢盤桓豫以二月出署九原有恨餘青史三踊何人僅素冠回首同時琴劍客生還獨一董庭蘭其四二月春深雁影稀沙明如雪照寒磯但知鳥逐蒼崕喚豈料虹隨白日飛客夢霎驚箕尾隔天心潛覺斗牛非徐無老向山中宿追訴平生淚滿衣徐無山名見田疇傳丁巳冬再入閩中過范侍郎舊駐兵處寒溪蕭瑟北風哀重過龍驤舊壘來千里寒雲空結陳三年碧血未成灰當空雁影愁中度無主梅花亂後開身逐天南忘嵗暮故園回首重徘徊延津感弔范侍郎疊疊青山在眼前可憐此地滿烽煙征濤拍處餘千里戰壘消來僅一年嵗暮隂陽殘臘盡天涯書劍客愁偏蛟龍風雨延津過回首司空重黯然司空張華也用雷煥劍事戊午春范侍郎家人迎載空旐北歸時豫在楊中丞幕中不能追送望而哭之三年此地又重來峴首茫茫墮客杯劍履已歸天上去風煙還見海邊開垂頭僕馬迎空旐含淚賔朋望舊臺陵谷不殊人事變屠龍射鱔轉生哀戊午夏日登釣龍臺遙望制府舊署追哭三首秋風凜烈一登臺毅魄遙從天上回賊難不勞摩利護摩利支天經云王難護我賊難護我水月師手授制府國殤空抱左徒哀靈旗半夜歸燕市碧血千秋照海隈絶命萬言遺恨在長空烈日起晴雷其二浩氣三年塞滿空一朝白日貫長虹節毛落盡憐蘇武爪髮存來哭魯公瘴海自今歸絶徼朝廷有日恤孤忠老生記灑臨岐泪磨盾猶經五夜同其三躡屐重臨逺鎮樓烽煙回首淚交流降王崩角重為將是時耿逆領兵住潮州都護苴茅再拜侯風捲籜飛關塞恨雲興蜃變海天秋空餘一片孤臣骨布裹歸來葬故丘南州李與偕重至吳門同哭范制府談笑驚看帶綬光故人今是紫微郎三年書劍征塵隔千里煙波别夢長雲渺碧天迷葛塢霜凋紅葉滿吳閶大梁門下同為客執手唏噓泪幾行夜泊江山縣感懷日暮荒煙馬背遙驚沙撲面兩蕭蕭空城宿處人三户殘角飄來月半宵往事依稀如夢記征衣顛倒欲魂消白頭南去重趨府知已天涯痛寂寥哭范覲公清苑郭棻驚傳閩賊殺忠臣老友心摧血目瞋一死于君原易事五倫斯世有全人長虹夜結昏江海劫火灰飛泣鬼神聞道九重深震悼中朝誰不淚沾巾甲寅十月十六日聞范覲公閩中消息不死知君志已違郎當况復虎狼圍三更對雪思平蔡萬里因風望采薇此際何時忘魏國幾回有夢到萱闈無衣未許書生賦老友闌干血淚揮奉挽制府螺山公十首上海范青憶送旌麾到百樓燕南趙北便千秋思親併作傷時淚之鎮翻同去國憂萬里君門爭咫尺半生家計足浮漚今來重聽蕭蕭水變徴聲中咽未休癸巳秋八月送公之閩别於雄縣之南易水上公時多感慨憂時之語比戊午夏重過其地而聞公櫬已先北歸矣御衣寬窄趁身輕天廄花驄蹀躞行羊坂何人悲短馭鯨波欲蹈請長纓公時唯欲立功海外兒童競識君侯面魚鳥皆銜故主情過浙江迎者一如送者回首西陵松柏路可憐歸骨竟誰迎籝骨悄過人莫之知水下牂牁五嶺連漢家南塞故依然怪來莊蹻思兼楚豈料無諸首事滇半壁支須千仞水中流泛失一壺船推原禍本憑先見三復當時痛哭篇節鉞無靈弮亦空霜戈揮斷染輪紅封疆事大捐軀細叱吒聲微罵賊雄縮地安從尋某澤仰天祇可訴冥鴻君親有淚揮何處辜負三年飲血中嵗久成髠不醉髠公在纍中自稱髠翁亦多瀟灑亦煩寃懷慚戴履君兼父貽纍綢繆弟及昆月下氷魂燈伴影雖在幽繫時有寄懷花月之篇雪中鴻爪炭餘痕以炭煤畫壁成稿斕斑吐盡常山舌一卷詩成白日昏疊嶂盤溪煙霧霾曵兵臥鼓壘將開軍前未繫降王組幕下先飛使相灰無路瞻雲歸鶴表何年澆酒釣龍臺度師枕席空天險似閃靈旗毅魄來從君而二願何甘祇為生平一事三母在許人仍孝子身亡不死是竒男窖中節嘆旄全秃畫底容嗔髮半鬖眼見四凶相舞蹈從容請劒尚懷慙腸斷淋漓絶命詞四方上下竟安之土花蝕盡紅殷繡蒼蘚拋殘碧磷疑沙漲射工搖舌喜門扄罔兩撼環窺人生但得名垂後有骨何須不朽為丞相原頭落大星飛飛丹旐引前汀死依關塞神猶鞏哀感山川地亦靈晚笛一聲雲漠漠斷琴何處澗泠泠幾行未畢平生志留與他人為續銘戊午秋葬公骨于懷柔山北塞下余與執紼之役宿莽賔朋幾個存蕭條不復舊平津頗聞談虎驚前轍爭敢呼牛屬後塵夢到青楓長有恨尊開白月為誰新炙雞過酹公知否十九人中是一人哭幕府范司馬清苑劉可書開國功名誰荷薪瀋陽家世有竒人光分東壁圖書富公弱冠官中祕節建西湖桃栁新出撫兩浙再遷督閩自信敬官成孝子原來厲鬼是忠臣乘風破浪何年事一夜塵飛閩海濵其二星羅碁布拱金甌首禍無端况效尤賴有孤忠甘百折屹然一柱砥中流偶乘狂颶奔封豕那得終朝坐沐猴天道好還應不爽幾曽疏網漏吞舟其三諸軍北至渡如飛旗鼓山前大合圍捷奏午門宣已再家書三月望中違孤臣幾化原頭血慈母猶縫歸日衣黑塞青楓魂路逺可能有夢到萱幃其四公幽禁中忽防卒喧傳曰樞密使相訪公佯問曰是何樞密來訪誰耶及見徐顧防卒曰原是劉撫軍公械杻被項肘兩卒扶之下床劉且前且揖方欲有所陳説公奮足力蹴之劉狼狽失故遂仆地左右掖之以出公笑曰諸逆無道旋即誅滅余一擊之力似不可少迷離側首望旌旗耳畔何人問故知名刺驚傳新鼎鼐衣冠儼附舊龜兹擊凶奮笏睚為裂撾叛揮旄節可持獨是伴身無一物但憑破革褫頑皮其五相看無用更欷歔正氣常存與太虛一夜黑風吹鬼國三年髙枕亦吾廬李過庭先生取杜句為公題齋額敝衣破帽朝元日棘室泥墻拜厯書劫火何曾灰徑骨人生到此始無餘其六逆忽使人問曰公在杭時聞與水月和尚曾往來今來閩彼有何言相囑耶公叱曰吾家世孔孟從不與若輩為緣忠孝大節豈死生利害所能奪耶即彼緇流稍有識者亦必以忠孝勸人豈肯妄言禍福歸語爾主自尋生路無取族滅也坐破蒲團誰問津垂眉低首憶前因現身説法惟忠孝覺性長明是子臣妄謂山頭能起浪幾曾海底會揚塵野狐墮落憑而趣慧業文人自有真其七徴書剛自被南荒便欲開門齎盜糧只道蝦前依水母那知雀後伺螳螂朱浮識鄙遼東豕蘇武名髙海上羊多少受降城下士一時揮淚白雲長其八笳聲隱隱鼓闐闐想見孤臣開笑顴犀甲三千臨瘴海降旗一片赴樓船投鞭但祝公無渡折簡應知我自然敢説主人不避客井蛙從此始知天其九三年一室足塵埃憤逐城頭畫角哀聞説師從六月出果然碑到百蠻開軍中范老今何在前度劉郎剛又來燕麥兔葵空惹恨春風不復越王臺其十百年身世會須終常把臣心對碧空總是繁霜摧徑草肯同落葉舞回風埋尸原擬龍興寺濺血誰收虎口中惟有無諸城上月夜深猶照土花紅其十一再來四十二春秋住世猶如出世儔公官中祕時常靜坐竟日讀書外一無嗜好已解勞生爭似死何妨厚德反為讐耿世爵幾斬文肅公因其先勞力請延之老人痛徹千行血少伯難回一葉舟説到君親恩便重可能諸有等空漚其十二無問長鞭與短垣須知帷蓋亦君恩兩朝尚主兄同弟異姓稱王祖到孫環海旌旗雄趙尉孤舟風雨助章惇可憐戴土生春草夜夜空山啼斷猿其十三軍門鼓角曉塵開羽扇髙張褚彥回遂有山狙充劒珮全憑海蜃壯樓臺誰言獸困身猶鬬縱化鳩形眼亦猜寧死秪憐袁景倩石頭城下水聲哀其十四強將優孟飾衣冠剛得開場興已闌可笑暴公多面目那堪叔寶少心肝誰無一死終難避各有平生總不刋欲弔忠魂何處所青霄明月滿長安其十五中流擊楫小橫汾歌舞濃時飛彩雲舊日河山新屬國再膺茅土故將軍朝廷祝網原宜濶俊傑規時果不羣只是硜硜徇義者一抔無處覔孤墳其十六何處飛空六月霜孤臣血碧斷雲黃明珠翠羽來南海白日青磷覆北邙豈有操戈讐共主還令執挺長降王憑君密詔求遺骨應薄當年陸賈裝其十七時有以不即死議公且譏其制變無術者故拈此應知天意篤忠貞不死何嘗纍子卿直使三年節益著故教十日餓猶生時逢異變無竒策事有常經惟至誠始信當時文信國小樓風雨度殘更其十八聞公遺骸尚未得共六首逢人不敢問遺蹤恨到傷心惟拊胸日壓孤岑餘落照風回大壑響哀淙看來世界羊腸險何處人間馬鬛封正氣歌終臣事畢武彛三十六髙峰其十九知君一死等尋常報國何妨即國殤金玉終須出墓道衣冠或可永桐鄉魯公爪髮原應異子敬人琴豈竟亡幾欲招魂招不得青天無語月蒼涼其二十慷慨無勞賦大招殘雲兀自住山腰路傍何處麒麟塜天畔遙看螮蝀橋氣挽銀河洗甲胄夢麾金鉞戮鯨梟傳來跨鶴東歸約何日將軍夜度遼其草一驃騎遺營草木深陳雲屯處氣蕭森須臾不定風塵色萬古常然天地心裹骨豈難尋馬革藏舟原不問牛涔相逢無限山陽淚慟哭英雄徒滿襟其草二思君幾度夢難安四壁悲風旅夜寒生敢當門真徑草死猶光國是祥鸞一碑無愧誰題墓百行能終此蓋棺月落屋梁燈半滅糢糊頸血未曾乾其草三碧血當年委碧叢九原今日又春風誰來樵徑歌晞露秪有松阿棲斷虹十載恩深同杜牧千秋義重愧臧洪獨憐越徼竒男子為武彛子許鼎也生死孤臣患難中其草四讀公畫壁諸遺稿得五首壁稿鈔來如斷銘水聲嗚咽向蘭亭千年浩氣凝虹白一代忠經續汗青筆陳霜飈摧落籜墨濤髙屋注寒瓴曲終掩卷神猶悸風雨蕭蕭走百靈其草五一字一椎一寸心不知是哭是長吟連聲和淚浮毫出帶血拖魂透紙深鬼泣大文舒日月人藏點墨重球琳怪來鏡裏頭鬚白滿屋風霜吹短襟其草六每把遺文即泫然庸奴直是罪通天席前狂士三撾鼓萬里孤魂一縷煙不盡低佪無限意誰能長誦到終篇客心何事重悽斷落日西風哭杜鵑其草七依稀紙上見鬚眉蔑視羣凶真小兒筆到誅心方痛快詞當絶命自淋漓只聞山鬼燈前嘯定有湘娥簾外悲石室人來爭墮淚巋然四壁峴山碑其草八萬里征鴻久未還霜毫何自照秋顔詞疑斷缺因聲咽字類凋殘是血斑無數大文藏碧海偶留片石在寒山他年應復求遺稿莫止青光寫百蠻其草九文肅公真容賜自內府公自浙涖閩皆恭懸官署朝夕瞻拜罹變後深以毁棄賊手為憂畢命時猶囑好義者代為收藏然宗臣遺像巍然賊見之皆羅拜不敢犯元老投簪返碧岑詔圖黃髮代丹針三朝儀表東山屐萬里殷勤寸草心髙閣瞻襟神奕奕空庭留響晝沉沉宗臣遺像人爭肅只是忠魂一念深其三十閩撫劉秉政辱偽職公之死與有力焉事平勒歸京師所過人爭唾其面行至浙浙民競以瓦礫投之舟幾覆防守者委曲開諭始解散得狼狽遁去中丞節鉞擁歸途可識春明是帝都此後小心真效順從前大事假糊塗千秋自負竒男子一路人看莽大夫獨是孤忠范制府君王每飯即長吁其三十一張福建者公部曲也隨公入逆署聞變單刃突圍當者輒斃力竭被執賊愛其勇欲全之大罵不屈寸磔死滿眼妖氛事可知漸離髮指羽聲悲半生拓落千夫長一劒光芒萬馬披始見張巡真將令果然南八是男兒只看浴血重圍日怒氣平吞尹子竒其三十二公舊役王道隆奉使金陵返至延平聞變持刀大呼自斷其頸未殊復挺刀剖腹而死生平不敢薄人奴若輩從來有丈夫率爾徑行憑血性等間欲擲是頭顱三封事主猶無賴下走酬恩竟有餘抽刃大呼聲愈厲可憐一刺未全殊其三十三公畢命時幕屬及廄下吏皆爭死無一人乞降者賊聚一坑瘞之丈夫視死等加餐五十三人共一棺豈盡讀書明道義但知報主有心肝魂歸瘴海七千路氣捲鐔州草二灘共道田橫能得士獨憐杜牧尚平安其三十四泰寧許鼎充耿精忠護衛公被禁時差司監守鼎見公不屈狀心義之有所需皆委曲力致公集中所載武彛歌蓋指鼎也公被害前一日鼎預知祕治容骸小椑藏于家及俾往焚化鼎伏山麓中一晝夜潛收遺骨負之而歸為位設祭納于椑中人迄無知者矢心九死志靡渝此日欣然遂故吾玉碎何妨同瓦礫金鎔到底是錕鋙老人病哭潛收血遺體全歸謾結蒲千載髙風追毅甫白虹長亘海天隅其三十五鼎負公骸于康熙丁巳年七月初八日潛行赴北風雨瀟瀟載客還傷心孤侶淚澘澘七千閩海芙蓉洞十八遼城木葉山逺浦漁燈吹鬼火斷橋霜月下危湍哀猿啼徹仙霞路也抵班生生入關其三十六西湖舊主臥扁舟忽漫重來此舊遊一切從今皆解脫有人為公作隱語更於何處作勾留公為湖心亭留題勾留處三字雲封孤嶂煙霞幻雁印寒潭蘆荻秋只有民情同畏壘家家淚眼望東甌其三十七公柩至東臯東皋為文肅公别業每燕息時集親朋子姪輩觴詠于此息影乾坤抱甕亭抱甕東臯亭名也程其相先生題額主人仙馭忽重經長松溜響吟霜徑病鶴含悽梳短翎家國無歸三載恨身名同史萬年青依然元老明農日蘭玉森森此過庭其三十八公柩奉特旨受弔于賜第大義偏能感道途爭看烈骨入皇都一生至性完天地未死人心盡董狐丹旐低空雲欲斷素車近土淚應枯蕭然一革行埋玉百喙難騰薏苡珠其三十九公柩抵第之明日上親遣內大臣佟暨侍從草餘員齎大官茶酒哭奠几筵哀動左右凡范氏親朋族黨無不感激揮涕勳舊聯鑣馳錦韀口銜天語淚澘然瓊醪清挹金莖露瑞草香分玉井蓮剩有餘哀榮死後毫無遺憾負生前孤臣骨朽心猶醉滴滴應知到九泉其四十諸逆赴曹公冡嗣時崇大呼賊名手刃寸磔之血濡袍袖見者無不嘖嘖檻車匝路盡王侯繫頸標名揭罪由不向夜郎雄海外却從廷尉望山頭天王奉法申常憲人子提刀報父讐十載立庭揮血淚血花今日濺霜裘其四十一相看不覺首重搔天網何曾漏爾曹癡肉頓分食例盡飢烏爭下噪聲髙罪浮十世南山竹臍熖通宵西市膏可惜千秋執簡者姓名也自點霜毫其四十二當年一炮突狼煙隔斷仙霞路幾干不謂雞聲催短夢還于馬腹及長鞭看來逝水終歸海那得浮雲常滿天誤謂金多須有用到頭不值一文錢其四十三上悼公忠烈豫祭營葬賜諡任子概從優厚至御製豐碑親揮宸翰尤為古今曠典陸梁羣醜敢連兵自古王師類有征伐叛宸謀欣破竹褒忠特典愧偷生礲碑誰更親題墓錫器何如得易名文肅已符文正後忠宣應復見忠貞其四十四淋漓御墨降麟洲一路松濤走玉蚪紫氣千尋橫碧落青泥百字拓銀鈎空山風雨驅神鬼永夜星文薄斗牛還似親承五色詔從容捧出鳯池頭其四十五玉樹亭亭孰與京謝庭原有舊家聲椒蘭到死香猶烈桃李無言蹊自成只道親嚴憐子孝元來主聖念臣貞君恩祖德均難報好守遺言圖令名其四十六公卜期窀穸余自以辱在舊知用敢虞歌周道然殊不自量也越嶠歸來剩此丘國華家乘又何求雲連白石開新兆地近紅螺是舊遊東閣觀梅寒抱玉西湖明月靜依秋山阿零落歸何處萬木蕭蕭客白頭其四十七風雨一燈繐帳孤故人飲泣愧生芻川原應待賢愚盡魂魄誰分聚斂殊遼海何年棲舊表西州此日悵岐途老生苦憶雄關次執手丁寧作後圖其四十八再過西園感舊松臺四望意茫茫猶謂伊人水一方屋角如存石骨瘦墻隈空憶棗花香斷橋有板蒼苔厚卧栁無枝野菜黃回首不知日欲暮乾坤終古有斜陽其四十九十年誰與共徜徉二仲悽然三徑荒蠨網吾廬吾廬公讀書處懸墨帳塵堆止水止水公泉名沒銀床草煙著雨低殘砌燕翼將雛上敗梁醉後抱頭看月色戍樓鼓角月中長其五十公入覲余就晤于雄州旅次從此遂成永訣雄州舊名瓦橋關十載幽并慰寂寥吳山忽倦馬蹄遙還君相府芙蓉幕老我衡門椰子瓢覲闕琴書經下里連床風雨話中宵那知一别成今古猶謂銷魂在瓦橋范忠貞集卷九
