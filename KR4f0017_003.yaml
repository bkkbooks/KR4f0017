body:
  text: 范忠貞集卷三清苑劉可書編督閩奏議條陳閩省利害疏具官臣范承謨奏言切惟古今之時勢有常必有變人臣之謀國有經必有權兹當滇南告警變起倉卒一切關係疆場之事有斟酌權宜可濟時變者即不得概執引經之説以疏于事先而忽于未然也臣且就閩省目前情形為我皇上陳之閩人活計非耕則漁一自遷界以來民田廢棄二萬餘頃虧減正供約計有二十餘萬之多以致賦稅日缺國用不足而沿海之廬舍畎畝化為斥鹵老弱婦子展轉溝壑逃亡四方者不計其數所餘孑遺無業可安無生可求顛沛流離至此已極邇來人心皇皇米價日貴若不安插倘飢寒迫而盜心生有難保其常為良民者矣我皇上停止海界之禁正萬姓蘇生之會而閩地仍以臺寨為界雖云展界墾田其實不及十分之一且臺寨離海尚逺與其棄為盜藪何如復為民業如慮接濟透越而此等遷民從前飄流忍死尚不肯為非今若豫以恆産斷無舍活計而自取死亡之理即釘麻油鐵絲綢布帛皆姦商巨賈勢豪土棍有力者之所辦窮民亦無此資本何由而濟如慮逼近沿海難免冦䑸侵掠夫海賊可以登岸之處不過數所餘皆海潮湧入之小港時湧時退不能停泊若設防兵堵禦要害則冦亦無隙可乘設立水師原為控扼巖疆未有棄門戶而反守堂奧之理目今多事之時海逆不無窺伺伏乞皇上允臣相度形勢應仍舊者照舊防備應更移者奏請更移務使將領不得偷安則門戶既固而遷民可以開墾復業無以糧齎冦之憂無透越接濟之慮兵既衛民民不失所此捍外安內之要著也從來富國強兵莫有過于漁鹽之利閩自禁海以來利孔既塞是以兵窮民困目下青黃不接之際追呼雖頻輸將仍緩兵丁乏授食之需引領協濟各省處處添兵在在索餉安能及期協濟乎今惟有請照木筏取魚事例容漁戶沿邊採捕每十筏聮為一甲行以稽查連坐之法遇開港之時止許隨帶乾糧不許多攜米榖等物令就近將領率防兵巡哨督押漁筏朝往夕歸仍照編甲次序灣泊內港聚集一處以便稽察其採捕之魚十取其一以充其課此項錢糧或接濟兵餉或借給遷民如有贏餘或存貯備修船隻一舉而數善備焉矣事如可行臣即相機設施如不可行決不致貽邊疆之患兵餉裕而國用自足荒田墾而流離可輯催科緩而人心共安矣臣無任悚懼懇切之至請興兵屯疏具官臣范承謨奏言竊臣受事閩疆下車伊始諸務未遑而時屆撥餉關係來年軍需不得不先為入告查閩地濱海兵丁之窮苦為甚嵗需協餉刻不能待往往撥解遲延難期宿飽虛欵虛項改撥維艱臣於陛見時業將缺餉情形及需餉急切之狀面瀆宸聽具蒙睿照兹請再為皇上陳之閩餉嵗需一百六十餘萬正月內即將本省地丁錢糧盡撥而東作未興徵收不前鄰省協解又復有限即如康熙十一年閩餉浙江以災傷無可抵解動支鹽課銀兩題請改撥既多展轉部覆重撥更厯嵗時軍餉之欠缺不可問矣再如十二年閩餉部撥江浙兩省與本省地丁錢糧及穀變等項抵給內有請撥補銀五萬九千一百八十九兩請找給銀三萬八千八百四十八兩地丁錢糧又不能嵗內全完約計一十六萬有竒其中各項有産盡者有蠲免者有查追者抵解無期是軍餉之欠缺又不可問矣竊恐次年酌撥之餉其中倘有缺額難完之項急之則徒困民生緩之又重滋兵苦題請改撥往返稽時夫以沿邊沿海荷戈執殳之人既無積蓄又乏生業乃寄性命於虛懸之餉而欲望其投石超距也難矣臣聞古之善用兵者皆于軍興旁午之秋舉行士卒屯種之法悉獲成效漢趙充國興屯而敝先零魏武屯田許下得穀百萬諸葛亮分兵屯田軍食不匱唐郭子儀屯於河中決機行陳畢諴募士開營田嵗省度支數百萬緡元初征討每遇大敵屯田以守明洪武撥軍三分守戍七分屯種養軍百萬不費民間一錢豈古今不相及耶臣雖智淺能薄恭遇聖明之主仰受特達之知何敢不殫竭心力以抒一得之愚昔世祖章皇帝親政之初臣父在內院時曾疏興屯數事當蒙俞允祗以後來奉行不善遂致停止今我朝興屯之法寓諸墾荒一行於招民募墾一行於安插投誠獨兵屯未聞肇舉蓋因坐食驕卒恐一旦率作南畝自食其力永無糧糗之望所以畏憚不行臣謂行之有法兵心未有不樂從者即今枵腹之卒前此之餉勢不能待將來之餉杳不可期一旦給以現餉即驅之鋒鏑誰不爭先况耰鋤種植之事乎從前墾荒之民例以六年起科則此屯種之兵亦俟六年之後始裁其餉仍於旱潦之年倍加賑恤是兵既享六年之現餉復得田畝之收穫又不憂意外之災荒誰不願興屯乎臣謂興屯更有五便兵之需餉必取于民司農仰屋守牧催科民髓日枯財源日耗矣而披堅執鋭之卒率皆鴛悍不馴無恆産以繫屬其心則渙而難固無操作以勞瘁其力則惰而圖安無生計以寬其日用則庚癸時呼惟是兵屯之法行將見金錢可省國用恆足便一也追呼不迫民漸休息便二也防卒變為土著堅門戶固藩籬便三也有事則戰無事則耕進可攻退可守便四也兵皆溫飽卒盡歡騰分為臂指聮為心膂消戢反側便五也有此五便臣何敢不請皇上亟行之至于地方有不盡宜於屯者臣謂又當因時而制宜屯可行於一處即一處受利屯可行于數處即數處受利屯得一兵即省一兵之餉屯得數十百千之兵即省數十百千兵之餉兵法云屯田一石可當轉輸二十石非虛語也臣又思招民開墾借屯本給牛種日後或有難還之憂兵則原係分內應得之餉不過先時現撥酌將鄰省實徵存貯銀兩預給兩月初不費朝廷額外帑金有司既免遲悮參罰之纍小民更得稍寬催徵敲撲之苦此又於五便之外推而廣之以明兵屯之有利而無害閩省之不可以不行也其餘本省撥給虛項原額仍在遲早徵足解補內部或留為次年兵餉一時之轉移尤為至便懇祈皇上敕部酌撥康熙十三年閩餉協解迅撥現餉容臣查勘某地某兵可屯若干督率將領倡導開墾更祈寬以考成遲以嵗月俾臣盡心力以行之其餘一切未盡軍屯事宜總俟次第題報庶足食足兵而邊疆收百世之利矣上封事疏具官臣范承謨奏言洪惟我朝定鼎三十載寵遇臣工愛育黎庶亦云至矣叨祿者鞠躬盡瘁以報君恩服疇者擊壤鼓腹而歌帝力於哉可以遐軼三代喜起之風永啓萬年太平之化矣何物么髍狡焉倡逆致廑睿懷臣一聞之不覺髮指眥裂恨不能飛渡萬里滅此朝食也伏而思之三桂平日無父無君人所不齒逞狂聚蟻離德無謀垂老弄兵光隂有幾况滇黔天末彈丸黑子欲以一隅之少衆抗天下之全勢其亡也殆不旋踵矣似無足為我皇上顧慮者惟是百姓久處承平厭聞兵革訛言一旦繁興人心不無惶惑此時若不收拾恐徵求急迫民不聊生盜賊蜂騰善良逃匿不可不為長慮而却顧也近日功令處分最重錢糧盜案有司畏考成懼參罰專務催科不講撫字競相諱盜不講消弭往往東作方殷西成未屇而追呼已到其門鞭撲時加其體求幸免之不能何暇盡力于南畝况厯來徵糧九分為率所以寬留小民之脂膏也今則十分取盈矣各省錢糧支給兵餉外餘作存留稍緩輸將所以備非常之急需也今則一槩解部矣雖曰可以杜侵欺足財用設猝有急切之用必發內帑不無重滋往返倘仍撥本年徭賦必致悉索殷繁撫司必責成于有司有司必徵比於里社大聲疾呼軍需為重遂有一面報完冀免參劾一面續徵以圖補項者矣舊逋未完新徵又至小民增苦司牧受纍此皆錢糧考成太嚴之所致也再如盜賊竊發所在多有官慮詿誤遂以強諱竊以有諱無甚至民間報盜反苛求失主株連鄰保者嗟此愚氓既受劫掠之慘又增官司之害茹荼誰告也以致相率隱而不報而強徒漏網山陬海澨潛逆橫行夫誰從而問之且文官所恃以捕盜者數名捕役耳惟兵備道舊曾治兵調度籌畫可以綏靖一方今皆不治兵矣且有緝盜不獲並加處分之責不知令操何術以緝盜也律例原載城內積至五起城外積至十起以上始行參究百人以上嘯聚劫殺者始行奏報其餘彚入嵗報册內年終具奏未嘗如是之嚴峻也今則逐起處分逐案題報矣參罰愈嚴諱盜愈密此皆盜案處分太重之所致也夫民之所好者寬廣也所惡者盜賊也今乃不能如其所好而重其所惡是以一聞滇逆之警閭舍驚惶雖遍下安民之檄一時稍定竊恐青黃不接迫以催科輟耕逃亡勢必滋蔓難圖况處處增兵在在增餉將來必致預徵斯民有限之膏血竭之則不堪其命皆不可不預為惠綏也至於閩民或困於浮糧或苦於舊逋或纍於賠丁或迫於寺田容臣逐一查明籲聞統祈皇上因時制宜分别施恩或賜蠲免或發賑濟或允緩征以收拾天下之人心更省刑赦過展堯仁而𢎞湯網復夏稅秋糧以紓民力寬盜案處分以釋株連如是則衆志維城執挺則可以撻堅甲利兵矣臣於陛見廷對之時業將民窮財盡之狀縷縷陳奏兹乃目覩情形備悉時勢若知而不言言而不盡夫豈人臣忠君之誼第當皇上宵旰焦勞之時臣又以危言聳聽實切惶悚不安然世受國恩終不敢自安於緘默也伏乞敕部確議施行社稷幸甚生民幸甚范忠貞集卷三
