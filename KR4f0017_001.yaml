body:
  text: 范忠貞集巻一清苑劉可書編諭祭文第一道維康熙二十年七月十五日皇帝遣禮部左侍郎楊正中諭祭原任福建總督加贈太子少保兵部尚書諡忠貞范承謨之靈曰朕惟國家朂勵臣工凡敡厯中外克著名績者必被以厚終之典矧處艱危而孤忠罔替守義分而九死不渝非示旌揚曷彰憫䘏爾范承謨禔躬恪慎奉職勤勞膺簡任於北扉俾旬宣於南服懲貪釐弊風裁可觀起瘠振貧惠愛斯在比閩疆之移鎮值逆孽之陸梁籌畧未施變亂旋及矢丹心於不屈三載幽囚蹈白刃以同歸闔門屠戮慘酷斯極奬慰宜優是用贈以崇階錫之美諡嗚呼捐軀授命樹臣節於一時厚䘏隆褒昭國恩於奕禩式將芬苾尚克歆承第二道維康熙二十年七月十七日皇帝遣禮部左侍郎楊正中諭祭原任福建總督加贈太子少保兵部尚書諡忠貞范承謨之靈曰惟爾矢心報國殉義忘身甫蒞巖疆遽罹狂噬疾風勁草視一死以如歸烈熖純鋼經百折而不挫特加優䘏以慰忠魂再滌牲牢式陳窀穸靈而不昧其欽承之宸翰褒忠原任福建總督加贈太子少保兵部尚書諡忠貞范承謨碑文朕惟朝廷簡畀重臣授以封疆之任平時則竭誠殫力以靖厥職猝逢事變則有凜乎不可犯確然不可奪之節舍生取義流光天壤古所謂不二心之臣如此而已爾范承謨名臣之子奮迹甲科入侍禁林出典節鉞咸有聲績著於當官洎閩疆蒞鎭之年值狂豎盗兵之日冦起門庭禍生肘腋智未及施勇不暇展而爾志恥倖生義無苟免奮身罵賊誓不共天遂致闔室幽囚三年拘繫阻敚其衣食迫脅以甲兵兇熖彌張貞操愈勁卒蹈白刃以作完人慷慨從容兼有其美兹者底定疆陲申明命討罪人斯得臣節益昭倍深軫悼之情特厚飾終之禮寵以隆秩諡曰忠貞嗚呼褒忠顯善帝王治世之大權恩命疊頒朕曷有私於爾以培正氣以植人倫庶使選愞之士覩盛典而知興慕義之夫聞休風而加勸勒諸貞石其永有譽於無窮哉康熙二十一年四月二十六日立先臣自罹閩變畢命巖疆皇上軫念孤忠諡廕祭葬優於典制殁者存者雨露均霑罔不鏤心刻骨矣迺者載荷皇恩煥發天章製文灑翰用表先臣幽隧敕工鑴勒精采入神鴻寶琬琰輝煌斧鬛先臣更不朽於九原矣又以御書墨本命祕殿􅋔潢鈐用御璽賜給臣家龍游鳯翥之奇遠近恭瞻忭舞交慶竊念服官致命固從來臣子所當爲宸翰褒忠實曠代君親之異數爰請恩給内工别壽貞珉垂諸奕葉俾臣家長㓜子孫一如先臣捐糜頂踵仰酬不世之殊遇於罔極爾難廕生臣范時崇稽首敬述范忠貞公傳公諱承謨字覲公號螺山文肅公仲子也沈毅英敏期抱偉岸年十七充侍衞順治八年辛卯詔八旗茂秀子弟應制科遂登賢書明年成進士改庶吉士讀書翰林院猶間日入侍甲午詔免扈從顓意肄業益肆力典文授𢎞文院編修乙未擢祕書院侍讀學士辛丑陞國史院學士康熙六年丁未敎習庶吉士戊申陞都察院右副都御史巡撫浙江公居禁近久雖謹嘿自持然畱心經濟於民生吏治瞭若指掌上既親大政思得貞廉以風天下首擢用之公亦毅然以匡濟爲己任及至浙絶苞苴禁私謁公移呈牒嘗積日不批答屬吏莫能測居月餘一日俱下利弊情形悉中機宜諸僚吏皆相顧歎服故事制撫受事三月後得劾奏不法吏及期兩司列狀以白公閲而哂曰是欲吾舍豺狼而問狐狸耶還之翼日忽拜疏一時墨吏皆列白簡中諸僚吏無不驚懼悚息浙故多巨猾率虎而翼擇人以食莫敢嚮邇公曰稂莠不鋤嘉禾不茂若輩皆大爲民害者廉得其人俱立置重典間有一二逋誅亦盡室走他方終公任内未敢一渉里門也浙東諸郡田多磽确或斥鹵彌望舊稱瘠土以故正供懸逋令以謫罰民以播越公爲請蠲奉㫖該撫親行查勘公即日戒途省車從裁供給從者纔數人凡山陬海澨蔀屋窮簷罔不躬厯或暫憩郵亭或偶息樹䕃山農獻脱粟村圃剖𤓰分果公㫖之如飫大烹也所至之處父老對語稚子投懷於是民隱畢達舉應蠲者皆具實以聞疏再上遂䝉報可辛亥歳大䘲民無食公籲天自罪捐粟設糜借司帑八萬乞糴吳楚未幾米艘銜尾而至下令平糶民以不饑是歲嘉湖兩郡水災尤甚疏請改折漕米二十二萬四千餘石冬復大雨雪仍請緩征俟明年蠶熟俱得請湖州例辦南北絲十一萬斤有奇南解江寜北解戸部運費不貲公請悉交杭州織造局又得請嘉湖應輸白糧六萬六千餘石玉食所需歲有定期公念灾民無力疏請三年帶徵亦得請公感激異數竭力撫綏體素羸弱夙疾陡作因力疏請罷温㫖許之浙人輟耕罷市排制府闥號泣請畱制府以聞上念其誠特頒温諭勉令力疾視事壬子冬拜兵部右侍郎兼都察院右副都御史總督福建軍務疏辭不允請陛見允之瀕北發浙民送者亘百十里擁舟不得前有瞽者百輩長號舟前曰小人心感公德目不能暏公顔願得進抱公足一摩公衣公矜而許之瞽者泣不止公亦爲之雪涕如是者竟十餘日出境百里外始得放舟長行也抵都入覲上慰問備至公頓首謝且力引疾上曰卿氣喘語艱且暫休息既出詔遣御醫就第診視兼賜尚方藥餌逾月病稍可命馳赴新任先是閩藩耿精忠請撤守歸京師勅遣吏部侍郎陳一炳爲治行公至閩籌畫深謹人不能窺精忠自襲父爵驕蹇多不法憚公威望引姻婭少長誼執禮甚恭公接見一遵儀制未幾吳三桂反詔止閩藩弗撤精忠不自安遂隂同三桂逆謀公覘其言貌異常深憂之欲出巡海嶠赴漳泉閲鎮兵以遥制之精忠力撓其行公自計麾下士僅三千人皆習與精忠部曲處脱有變不足恃乃密檄諸道將以謁新制府爲名各率健兒至用折逆謀未及行精忠反佯言海冦且至邀公議事左右請衷甲以從公曰毋衆寡不敵躁動奚濟未幾巡撫劉秉政亦至促之同行公明知事有變故坦然按轡至逆邸已露刃蜂屯矣公知勢無還理挺身而前仰天大罵賊衆環臨重加束縛時一二狼卒有誤持劉臂者逆黨馬九玉急叱曰巡撫我一家人秉政惶恐斜趨而出公噴血切齒醜言痛詆賊衆拘之隘室水漿不入口者凡八晝夜舌敝唇裂齦肉皆腐罵聲漸微聞者猶狼藉塞耳瞋目怒視閲十日神氣反旺自度不能死稍進杯水精忠復遷禁向内峻堵密棘防之益固一日忽遣逆黨劉秉政來説䧏公時杻械被項肘令兩卒扶之下牀劉且前且揖方冀有所陳説公奮足力蹴之劉狼狽失故遂仆地左右掖之而出公曰諸逆無道旋即誅戮我一擊之力似不可少公在幽繫中七百餘日日冠賜冠衣辭母時衣每逢朔望輒奉時憲厯一册被械北向拜跪溽暑時濕蒸如膩蓬垢支離虱蟣蚊蚋攢嘬不休冬深夜永霜颷海氣侵入肌骨卒堅忍之罵詈之餘閒作詩文無毫楮乃燒桴存炭畫壁上得詩若千首復爲文自叙其生平大槩云丙辰王師破仙霞精忠降飾辭希免死慮公白其實於九月十六夜遣逆黨來害公公時方側臥聞變微笑曰今日方畢吾事索賜冠賊黨吕八者奪而擲諸地復蹴之公怒以械索摔其頭幾斃乃披衣露頂遥望闕九叩首曰罪臣奉職無狀死遲矣遂遇害一時同死者自幕客至𨽻卒凡五十三人初公之被難也部曲有張福建者聞變手雙刃大呼奪門當之者無不立斃力竭被執賊愛其勇欲全之大罵不屈卒就死繼而精忠以三十二人監守公中有䝉古人嘛呢者爲僞散騎郎謀欲免公於難事泄精忠訊之大言曰范公忠臣爾逆賊寧與忠臣同死不願與逆賊同生精忠怒磔之又有泰寧人許鼎者義公所爲恒陰左右之凡所存片紙隻字悉爲收藏精忠既害公令賊黨焚屍棄之山野鼎預往伏匿夜分行亂石宿莽中覓得燼骸藏於家明年鼎負骸潛行紆折萬里竟達京師事聞上震悼遣内大臣佟國維等三人御前侍衞二十人齎大官茶酒哭臨其喪至壬戌精忠伏誅當赴曹時公子時崇親執刃寸磔其肉取其心以告於公見者無不嘖嘖上念公純忠大節䘏典槩從優厚營葬加祭任子賜謚忠貞至御製碑文親揮宸翰詔以眞本賜其家尤屬古今曠典公忠孝性生友于敦篤贍給族黨不遺餘力擇交惟謹雖賓客過從日盈座上而心許者十不一二然春風所被無不傾倒者居官剛正廉明而寛厚愛人體䘏民隱故所至人歌咏之至比之愛日德星焉公博學彊記善屬文於詩尤有法遭難來多所散失僅存吾廬稿浙閩奏議百苦吟畫壁詩文十餘巻行於世清苑郭棻撰崇祀錄福建福州府十學儒學廪增附生員林方葳林之瑾陳濬王化純潘天麟許青霞吳能洪熈載陳日行林湛等爲大節光昭日月深仁永著河山懇乞崇祀名宦以光爼豆以慰輿情事竊惟柴市樓空歌畱正氣峴山碑樹淚灑偏襟聿彰聖代之名臣丕勵彝倫之懿範伏念本省前任總督部院范諱承謨經文緯武鐵面氷心斗曜鍾奇篤生三韓之地箕裘接武濟美太傳之家蘂榜流芳花磚步影爰出禁中之頗牧用作越地之金湯乃害馬必除扶顚踣以閑轡勒因哀鴻甫集脱矰繳而謀稻粱北闕賡股肱之良南天借鎖鑰之重遂移福曜蒞我閩天廉以物躬所啖惟峯前一水静以馭動相看獨省内三山方期久挹威鳯之祥何意遽遭潢池之弄顧才能制變痛時勢之非常竟忠爾忘軀致英雄之齎志忠誠感被親丁賓客亦甘蹈刃如飴烈氣激揚婦女婢鬟俱各投繯恐後聲淒夜雨遂令對峯五虎而悲號氣捲寒潮行見連郭千榕而濺淚兹逢大宗師袞榮一字論定千秋追念忠賢褒成盛典以死報國信竹帛之載光以惠勤民知瞽宗之允洽葢其大節沸于萬耳爍于萬目不待頻勘結而得定評若夫附祠酧以三獻進以三登固宜借趨蹌而隆崇報伏乞批行主者擇吉置主送入名宦庶輿情允協而爼豆有光矣爲此具呈須至呈者閩縣儒學敎諭謝看得前任總督部院范仁浹七閩功存萬䙫殫事君致身之義學本素優矢見危授命之忱守而勿失浩然正氣捐軀而碧血長存卓爾孤忠殞命而丹心不死念生前之厚澤拊膺墮淚愚夫婦感泣之誠畱死後之芳名表烈顯忠都人士闡揚之誼固宜學宫鐘皷振盪幽魂而明徳馨香風勵名敎者也候官縣儒學教諭黃看得前任總督范功髙百世節著千秋厯任清華荷隆恩之寵眷象賢太傅嗣相業之鴻休撫越四年文化誕敷江左制閩五月德政功被海濱侍養多年固表事親之孝捐軀一旦尤全報主之忠縶幽囚而百折不移嚼齒牙而高聲長詈名可垂於竹帛節若峻於丘山允宜永配宫牆長享爼豆者也閩縣知縣祖看得前任總督范學貫六經才參兩大本成已而成物勲猷必出乎至誠資事父以事君忠孝乃原於天性始而撫浙六橋花栁堪圖政事文章繼而督閩八郡山河永奠深仁厚澤豈意潢池竊弄甘心縲絏覊囚抗節守貞三載歌畱正氣見危授命千秋鶴唳華亭逺擬聖門四科之選今集大成近揆厯代配饗之賢尤多勁節允宜崇祀以附宫牆候官縣知縣趙看得前任總督范一身任天下安危三載罹幽囚困苦既絶粒而復生且服衣而不解從容就義維殷報主之忠慷慨存仁遑有思家之念愷澤旁敷於兩浙慈惠興歌大節聿昭於八閩忠貞堪頌允作宫牆型範永垂爼豆馨香當與天地共戴不朽者也福州府知府陳看得前任總督范河嶽奇姿乾坤正氣撫綏兩浙錢塘江水盡恩波總制七閩平逺陽春皆德澤豈潢池之一弄遂拘繫於三年絶食捐軀抱孤忠而丹心不易成仁取義厯百折而視死如歸勁節凌霄忠貞貫日允宜配享爼豆以激靡風以洽輿情者也布政使司姚看得前任督憲范氣壯河嶽節勵風霜作孝作忠才不負乎所學報君報國志無忝於爾生撫浙四年愷澤淵深嶽峙督閩五月仁恩日惠風和詎意變出非常隨致身罹奇禍受繋受辱忠心百折不回任湼任磨義氣三年彌篤洵矣孔之所謂成仁誠哉孟之所云取義者也品行宜祀宮牆姓字永馨爼豆以光倫紀庶慰忠貞巡撫福建部院楊批如詳行仍候總督部院批行繳總督福建部院郎批范公清勤忠烈崇祀允宜應如多士之請以光爼豆仰即舉行仍候撫部院批示繳提學道孫批前任總督范誓報國恩百口斷頭而不顧矢全臣節三年繋頸而益堅忠魂逐海水常寒勁節偕閩山作礪允宜崇祀名宦以慰封疆大臣於地下可也送主入名宦祠祝文維康熈十有六年歲次丁巳秋七月丙子朔越十有三日戊子福州府閩縣知縣祖寅亮候官縣知縣趙世晟謹以清酌庶羞之儀敢昭告于皇清通議大夫原任總督福建等處地方軍務兼理糧餉兵部右侍郎兼都察院右副都御史范老大人神位前曰三韓雄鎮代有偉人文經武緯吕渭伊莘緬惟我公嶽降帝賚早掇巍科玉堂展采厥先太傅勲勒太常象賢濟美前㣲後光撫浙肅僚威名貫斗布德宣猷輿頌在口天子宵旰軫念閩疆特隆節制永賴金湯閩人望公公來何晩五月平章恩膏暨逺禍變倐起百折不回捐軀報國士民痛哀謂古聖賢爼豆奕世奉公祀焉春秋配祭英靈如在追慕常新億萬斯年二卣明禋尚饗福州府十學僉呈生員林芳葳潘天麟林之瑾許青霞陳吳濬能王化純洪熈載陳日行程翰林志湛林酉周宗􅕔趙良臣范宣猷李之駿何振先許湘華林可樑林方華林之璋蔣衡吳兆甲藍飛鵬王嶙然戴天任鄭仕進林豸冠蔡昌衡黃起鵬林鳯翔趙良英鄭若鈺羅采金學澄陳孟王九寧林馥項方林林蕚林迪基陳儀黃鳯雲廖翔林日高陳峋金家潮楊麟許禹邁甘錫毛翼坦林珽馬樹錦何菁王宗異黃芳鄭志擢張廣曹孟驥陳越王欽祖薛湞余蠡銘彭雲鄭啓烈鄭焜曹廷輿金漟鄒時化鄭遴張天瀚鄭康陳復汾吳旦陳聖泮王亮施偉業鄭達陳指暹髙日陳堯駿施挺鄭啓炟張靄齊洪超林班趙聖謨陳諟鄭登履張潢林椿茂陳瑋林文遇林鴻鄭瑞均王鶚魏繼友陳覲宸曹鴻芝王塏張斯颺甘琦廖永掄王禄高金梓陳石卲承憲王綱吕肇暹王信斯黃文俊劉燿黃元梅陳愷陳學端張墀石昌𦙍周瑛張士城宋瑨李大燏吳紳胡其斌舒瑞王夢龍林賓嘉陳陳璸嶽俞廷瑛謝章葉賁然李楷陳夢嵐蕭松卲愼言何珏楊卿芳林撫葛爲光莊炌林然球卓諾林國翰陳清張子彬力儼王惇允蔡鈺蔣昌增薛衍林有枝陶挺鄭三鑾陳重林之蘭林梅鄭酇瀚蕭𦙍林雲鍔葉榛陳世豫王瀚林公厯林受蔡上吉馬亨薛發衍林坤葛起㮄陳嶙廖鳯羽鄧昶廿以鉉王寧薛允中葉樞陳子煃力僑林宗璋孫重林五錦施彩袁兆乾陳文須梁陳泌恃葉正瀚戴化龍林有韡洪榮楊臣鄰張子儀陳升曦張暐林鴻述林羽朱任𢎞陳鍾李開焜劉煇陳作楫陳駰林龍材李夢林錫衮鄭相藍方演林開王志調翁煌陳文遡陳暹葉翊聖林霱孟大瑛王韶朱希周邵貽陸國禎劉祈焦亮采陳謨鄭一楨唐䕫鄭愷極陳素郭維儀林季陳宗莊薛侗王天琮謝申陳㨗先高恬林開梃劉勲陳文𨽻林璠李可鼎張林林逢春林皦郭朝奕程璜陳允𢎞陳儀鄭謝璨恩魏明志楊獻策李王昻真楊君焻蔡灼林紹勲陳珽周廷絅鄭蕖邵揚春林琦林敬聲魏一林宗璋鄭磊邵振助陳庠陳元勲田禎林瑞相黃吉林滋玖林培陳國表吳瑛周定國趙熀鄭子垐張位官上遴林峮梁巒銓朱逺游祿勉甘基鄭日培陳新陳廷彪高驥鄭丹鐸陳書陳天柱邵良佐趙士琳黃章羅擢錦鄭啓有孟燕芳戴宗禮胡繼祺高宗圭葉天簡翁陳書陳自馨何元濬林文静陳克英張觀光沈增輝徐三錫劉必第姚可教張子吉卓道高林中升忠貞范公祠堂碑記福建烏石山上成仁取義君子之大閑舍命致身人臣之亮節故作忠作孝所以立萬古之綱常而懋德懋功允不愧千秋之崇報如原任福建總督加贈太子少保兵部尚書諡忠貞范公諱承謨其人者生則降自崧嶽爲半壁之長城死則重如泰山扶兩間之正氣者也公少壯登朝精神許國父爲從龍之首相世篤忠貞身應鳴鳳之昌期名隆翰苑樞機參北院蚤結魚水之懽鎖鑰出南天旋奏虎林之績遂移浙土擢制閩疆葢自下車之初快睹飲氷之操安全爲念謂釐奸剔弊之在所先痌瘝乃身如拯溺救焚之不容緩凡經咨訪次第舉行以邦本莫重於務農而民力亟謀其寛恤落甲自運而里戸不困包賠革役給單而現年不病需擾差徭計畝均派以清任意盈縮之姦丁口按地編徵以杜缺額逃亡之害軫恤匠籍而一班不患重科蠲免寺租而一田不憂兩稅併圖减役而人無出鄉充役之勞分圖納糧而人無越境催糧之苦以至里書聽乎公舉册式務於簡明所有種種之檄行具見諄諄之節愛其興文敎也徧頒上諭之講章以維風俗躬臨觀風之考校以重膠庠其修武備也察核將弁之材能而勤騎射汰補目兵之羸弱而簡車徒凡兹老成練達之深心莫非桑土綢繆之至計顧乃患生肘腋冦起門庭誠有如睿鑒所云智不及施勇不暇展者公奮身罵賊緘口絶糧兇燄彌張毅操益勁段司農笏批朱泚顔杲卿面唾禄山自昔所稱於今爲烈將食叛人之肉枵腹不饑每握義士之拳拊膺欲絶若氷趨乎鼎鑊而䑕視乎豺狼讐尚戴天憤餘生之與共艱逾嚙雪誓九死以不移卒騎昬虛旦栁而歸允兼慷慨從容之美未幾底定大節益光皇上軫悼藎臣優賜諡廕祭塟重以御書給爲家寶可謂極褒嘉之異數備存殁之至榮矣惟我閩人欽魯郡之孤忠思國僑之遺愛已於康熙巳未僉籲建祠饗祀春秋至今九載近薦紳士庶愾慕益深謀拓祠而大之先立華表用壯觀瞻請於今撫軍張公捐清俸以佐梓材及郡守王公經營以董其成扶植人倫信羣公秉彛之好謳歌子惠尤八郡愛戴之誠廟貌翼嚴浩氣將道山並峻英魂昭假芳名與炎海同流勒可久之龜趺揚不磨之鴻烈樵蘓一禁永為彰德之林爼豆二丁長作表忠之觀賜進士出身通奉大夫禮部右侍郎兼翰林院學士加一級壬戌巳未兩知貢舉前内閣學士兼禮部侍郎内國史祕書兩院侍讀學士侍讀編修庶吉士纂修實錄玉牒日講起居注官己亥㑹試同考丙午順天武闈主考治年家眷侍生富鴻基頓首拜篆額賜進士出身嘉議大夫經筵日講起居注官翰林院掌院學士兼禮部侍郎敎習庶吉士前内閣學士兼禮部侍郎侍讀學士編修庶吉士癸丑㑹試同考治年家眷晩生李光地頓首拜書丹賜進士出身承德郎右春坊中允兼翰林院編修庚戌巳未兩充殿試受巻官纂修玉牒内國史院編修内𢎞文院庶吉士己酉雲南正主考治年家眷侍生鄭開極頓首拜撰文鄉紳陳殿軾陳邦陳丹藎鄭宗圭陳元勛陳鏡白李賡明謝恩翁鳴煌毛岐蔡其聰何徵蘭舉貢監生員王化純林紹勲林方葳蔣衡林之瑾程瀚陳吳濬能彭蠡雲薛佳林豫吉洪熈載金實潮陳芳趙良臣邵汧曹廷與何元琦鄭汝佐張寵錫孫元蘭林湛戴天任盧薪孺陳王煃璞林定儀周國陳兆淮袁乾潘天麟馬樹錦林公厯戴瑾羅若采林珽周宗􅕔許青霞唐時儒陳鋡林上苑林相陳學孟林賓嘉李趙岳琰王元衡胡琬彭陳偉煒陳宗盛何賜䇿李林模俊劉必第邵助鄭芳程王庭源李鼎新鄧光宗鄉耆何維章張圻維林可棟儲穀鄭世美胡伯祚何元吉倪德儀鄭一順鄭鏡夏士龍陳履墀王文煜邵景尭盧許庚璣朱鄭恒賢李起麟鄭日鈞大清康熙二十六年歲次丁卯臘月朔日穀旦立重修范忠貞祠堂碑記乾坤之所以不壞人類之所以常存而三綱九法之不至于淪胥者繄何物哉則恃有忠義之氣以維之也是氣也涵於心根於性而成於學其未發也窅然與無極同體發則貫日星薄風雷亘河嶽甚而齒可折舌可斷脰可損血可爲碧而此氣必不容夭閼焉于以厲世磨鈍相勸爲國家不二心之臣而亂臣賊子亦知所少戢矣于少保忠貞范公可觀焉公諱承謨字覲公爲太傅文肅公仲子少習臺閣故事多讀書其于忠孝大節雖由性植亦其家學所漸然矣量寛𢎞恂恂弱不勝衣遇事則毅然不可奪當章皇帝時常侍禁中壬辰成進士厯官直綸閣今上尤重之畀撫浙江威惠大行先是錢塘潮失期者十年所公至復故人異之以病請告浙人撾皷叩闕乞冦君爲畱一歲旋晉八閩總制復引疾且請陛覲召對慰勞有加賜尚方珍藥遣醫相望于道親解御服以寵其行眷遇之隆人臣罕儷公感激思効念海疆凋瘵軍政廢弛逆藩久䟦扈于是疏展界以安民調協餉以安兵復裁額以實伍赦逃弁敘勞勣以收山海之雄綢繆畧具甫五月而逆豎反先是公謀以數十騎出據閩安又欲托巡海置身外郡爲牽制逆豎計皆爲同事所阻不果行而時逆迹未彰公出適滋疑貳反授逆豎以辭而撡文墨者因得爲公罪公是以寧墮虎口勢孤力屈而惟拚一死謝封疆也公往奮身大罵逆豎怒纍公深室防䕶謹求死不得絶食踰十日不死吞蠆亦不死氣才續罵如初逆所爲逼脅窘辱者百端卒不屈乃著䝉谷自序及百苦吟以見志如是者三年而賊勢日蹙遂决意殺公遣逆黨至繫所公從容北向稽首遂遇害其弟承譜賓幕嵇永仁沈上章王龍光李全領纛王天祐家𨽻于通等五十餘人感公壯烈皆死之逆豎怒公不已焚其屍而投之郊葢康熙十五年九月十六夜也嗚呼當逆豎之初逞也使人盡如公則賊氣必挫賊焰可以不張始也多方牽掣以敗其成一旦倉卒愕眙屏息叩頭而乞餘生者相隨屬也公以孤注砥狂瀾奈之何哉然公凛凛正氣隂禠逆豎之魄而喪其膽宜乎公骨未寒而逆豎已烟消灰㓕也天子憫公忠特贈宫保諡忠貞御製碑以表公隨磔逆豎于市以釋公憾並聽立廟以旌公忠嗚呼公雖死猶生矣公身罹拘辱節毛盡而志不回蘓子卿之雪窖也抗首淮西取忌希烈顏清臣之佛寺也賦詩寫恨困躑幽憂無挫辭亦無變色文信國之小樓也是非炯炯忠義之氣根于性成于學者深而烏能臻此乎祠在道山之麓歲久盡頺制府大中丞子延興公奉特簡駐節兹土清至飲閩江一勺水節縮俸糈鳩工庀材而新之神明煥然觀瞻肅然於以仰體我皇上勸忠之意甚深且逺而有裨于三綱九法甚大予備史局於忠貞實後進也固樂得而紀之並系以銘銘曰井蛙窺天尉陀坐大逆穉而狂亦甘化外紛紛白馬攘攘黄巾王鐵暫逋磨牙吮人九日爲昏三山鼎沸刼我官司刀蠭劒蝟桓桓范公世篤忠貞手劒而起毛髪風生舌奮常山笏挺太尉䘍怒首攖三年纍縶絶粒不死吞腦仍存炳炳大節地揚天掀天成公節終假賊刃公骸可灰公心難燼魂遊帝所氣薄天閶生哀死榮廟貌是皇駕風鞭霆英靈如在還作山河衞我炎塞考鐘伐皷男走女奔血食千䙫忠孝一門康熙三十年歲次辛未秋七月賜進士出身文林郎日講官起居注翰林院編修大清一統志三朝國史纂修等官戊辰科㑹試同考充殿試收掌官庚午科特簡浙江鄉試正主考前翰林院庶吉士楚黃後學張希良頓首拜撰匾額對聨氣作山河霜日表孤忠任化碧飛灰畱得鬚睂撑宇宙春秋明大義笑亂臣賊子誰餘血食到兒孫眷弟興永朝頓首拜題范忠貞公祠堂碑記浙江孤山上予表弟范忠貞覲公爲予同母之舅氏太傅文肅公仲子也由學士而受命撫浙惠澤之被人者深矣嗣於癸丑冬督師八閩耿逆之變罵賊不屈幽縶三載卒爲所害淛之人士追感舊恩因立祠於孤山之麓而祀之以予爲忠貞中表戚特問記於予予曰國家當多事之日獍豕跳梁稱雄竊踞抗逆王師以荼毒其生民斯時必有秉志守節之正人碩彦自矢孤忠仗大義明大倫齒劍潤鼎視死如歸於烈熖橫流中以明委質無二之心效見危授命之節死于其所當死雖不幸猶幸也故魯公之死於賊臣龔勝之絶粒皆死得其正非求知於天下後世也第其懷忠抱義英爽正直之氣自足動後人之仰止懷慕觀感興起垂諸百世令名不朽尸而祝之乃萬姓有同心而不得不然者吾弟覲公之死乃得其正矣因念吾弟少負儶異長抱經綸黼黻皇猷功深啓沃䝉先帝之拔擢荷今上之眷隆畀以東南之重寄五年撫浙萬姓䝉庥巷陌知恩謳歌載路方宸衷以强藩叵測南顧憂深乃命吾弟節制閩疆以防跋扈陛見􅈤辭者至再而聖明眷顧愈殷饌饈出自天厨醫藥給於尚方存問之使相望於道趣駕之命日厪温綸吾弟感不世之遭逢荷特達之知遇志堅報國力疾南行節麾所指薄海觀呼正期殱鼓鬛之長鯨奠黔黎於嶺表豈虞吳逆倡亂孽豎效尤其時變起倉卒智者不及謀勇者不及禦乃囚於幽室肆其暴橫三年桎梏百計摧殘吾弟剛腸如鐵百折不回齒足並於睢陽舌不愧於常山朝野想望忠貞固期吾弟於一死矣然猶冀於萬死一生者蓋欲上慰君親下慰黎庶苟能持節而歸即可致主澤民列辟庶寮猶得依毗於正人碩彥也嗟乎豈意當王師破賊之日終不免於慘死哀感遠邇慟徧市朝聖天子垂憫忠貞切齒叛孽磔逆屬於西市雪九原之痛憤加秩贈諡予祭賜塟墓碑製自宸翰䘏廕及於後人隆恩寵渥至矣極矣今浙之人士建祠以祀雖未如閩人之請於朝命然爲國家死事者則祀之有功德於百姓者則祀之閩人既已得請則此浙水數椽爲孤忠之香火亦定荷聖明所嘉許者也予故敢述數語記之亦欲使後之人懷慕仰止觀感興起垂諸百世令名不朽云爾浙江等處提刑按察使司清軍驛傳道今陞貴州等處提刑按察使司按察使前山西道監察御史巡按江西分守嘉湖道布政司參議愚表兄李之粹頓首拜撰康熈二十四年歲次乙丑季夏吉旦忠貞范公祠堂碑記浙江孤山上從來忠臣烈士殁而尸祝徧海内者皆由剛大之氣彌淪布濩與日星河嶽俱永而其臨蒞之邦德澤在人尤爲靈爽所式凴焉前浙撫贈太子少保兵部尚書忠貞范公殉節八閩矯矯風烈邁越古今康熈廿三年余承乏浙藩當紳士建祠以祀公於孤山之麓高甍巨桶與四賢祠爼豆相望敬爲文以志於麗牲之碑夫公之爲德兩浙樵牧媍孺皆能言之無庸更僕數方其移疾乞歸臺垣及提鎭諸臣先後疏畱而攀轅臥轍者接踵於道甚且士民欲赴闕擊鼓登聞心期得請而後止今身殁之後士民謳思尚如一日可見秉彛之在人心不容强也然公之卓然可紀者不難於浙而難於閩叱馭巖疆狡謀環伺左右肘腋皆其私人一二封疆大臣依附觀望而公幕下智計之士或勸以愼重出入勿蹈賊巢或説以潛出㑹城扼據上流諸郡無非欲公畱其身以有待而公義不返顧鼎鑊如飴罵賊以求死絶食以求死至於窮冦倒戈克復可待而終不免於死公之死不死於賊害之日當耿逆假謀㑹議遂攣執逆庭黃霧四塞旭日掩光造物早已全節予之矣葢公當疆事萬不可爲之時力竭勢窮而後死方諸顏魯公之死於蔡州尤爲過之豈直爲一時死事諸臣之冠哉讀公畫壁之辭凛凛數千言念念不忘君國誓以捐軀報主􅅹其血誠雖於睢陽殁而殺賊又何讓焉卒之兇徒明正典刑爲國家消南顧隱憂公之勁節流光天壤靡有窮已皇上軫恤元臣崇禮有加至親灑宸翰褒忠顯善雲漢爲昭此又干古人臣所不能得之於身後者而獨於公覯之余忝附姻婭之末曩者數載屬吏知公最深是役也不獨仰企懷思而亦欲書之以爲百爾勸焉康熙二十三年十一月朔日巡撫湖廣兼提督軍務都察院右副都御史前浙江等處承宣布政使司布政使舊屬石琳拜撰巡撫浙江遺愛碑記浙江平湖縣古來名臣賢相其鴻業炳燿於當時後世者在朝廷則朝廷重在封疆則封疆重故紀之太常勒之貞珉以昭示不刋若蕞爾一小邑其頌聲僅比於蟬噪蛙鳴即豐碑亦祗如泰華之拳石奚足爲重輕哉雖然煦日所暄曝膏雨所潤濡普天同被而比戸各以爲暄我而潤我則一家之戴德即爲億萬家之戴德寧以其蕞爾邑也而小之若今大中丞范開府公英姿出於天挺家學原於累傳遠紹先憂後樂之芳猷近踵弼亮迓衡之燕翼齒未弱冠連雋兩闈而登木天之選蒐編玉局視草鸞坡其著作之在瀛洲者早已珍同琬琰矣當期漸陟黃扉以彰燮理而聖主有特達之知謂文章可通於政事而内治亦藉於外寧必試之以岳牧之長才而後可任百揆之熙載惟兩浙素號雄藩足展偉畧於是東南半壁畀以撫綏然浙雖舊有繁華名亦屬凋敝之餘也惟公膺重寄而深有慮焉慮夫秕政多而吏治罕實效賦役艱而田疇非樂郊請謁徇而干澤致骫法豪强恣而市虎爲伏戎舞文巧而城狐等蟊賊讞牘繁而沉枉嗟覆盆也甫駐斾旌即申飭條約周晰精詳俱欲徵之實事匪徒列之空文者良由褆躬矢志氷蘗是凛不染一塵乃正已以率下故風裁嚴峻有鐵面之稱然又沖和接物平易近人大抵語及公則藹然以温語及私則毅然以肅葢一身而備四時之氣焉若乃洞晣民隱如引蔀屋於襁褓又如燭微曖於燃犀固非術之鈎索而迺誠之生明也歟試畧舉其剔弊則額外之加派有禁税契之重勒有禁頺俗之溺女有禁逃人之借攀有禁呑債之婪息有禁弁伍之漁利有禁而奉行者咸兢惕以恪遵矣畧舉其利賴則開滌壅水以通委輸給墾蕪田以登禾黍飭行落甲自運以豁民累酌定官收明效以甦民困而其所最勞經畫者則災沴頻仍菜色盈路且紛紛溝中瘠矣惟我公特念切痌瘝弗憚跋涉徧厯阡陌間實閲被災多寡上請蠲恤而又以漕糧難辦則疏陳折兑省民間十萬金錢税課難輸則檄諭停徵免新穀新絲之慮復於額外籌䇿他方轉移廣市鄰米拯濟枵腹無算比於富鄭公之賑青州更有苦心玅用存焉而所尤不及者奉上諭所頒十六條致治化民之要衍爲直講頒示郡邑朔望講學使民還醇古漸致太平此真以周程之理學而敷爲臯䕫之治化功不止政事而在人心德不止一時而在千載也然此但畧述數端而其他匪可殫紀當湖亦係海隅兹幸鯨氣恬謐之際公既嚴海禁之令而又軫海壖之氓不獨在甬東甌越也且兵悍民孱相沿日久則懲戢營丁於㑹城而并杜其肆凌於旁邑湖雖僻壤亦庇恩威之帡幪而湖民乃更有獨沾者旄節下賁確覈軍田迺從輕履畝時與牧豎村農面詢疾苦察邇言以興利除害斯又湖民所親被德施者矣則以全省之頌聲私爲湖邑之頌聲亦奚不可哉今宸眷復以八閩重地俾總攝乎奮武揆文將移治浙者以治閩閩何厚幸也而浙民依戀靡釋又無計攀轅僅於榮發之辰隨軒車所指彩鷁所經迤邐絡繹凡捧香摶顙者趾錯肩摩此數百年來所僅見自非仁心仁政有以深入乎民心烏能若是哉葢公之先世有文正忠宣相繼爲宋室名宰相然皆敡釐方鎭出宣勞勣入秉鈞衡今兹象賢纘緒且將由建牙以瞻調鼎矣湖邑士若民合請於大令陳侯謀紀石垂永而徵言於光旭葢以通籍釋褐附驥同升及來撫浙猥辱下交且惠錫高吟披德音於風雅故弗敢以鄙拙辭而特於揚扢莫罄中抒鈍管以述梗概然此非光旭一人之私而邑士若民之公也亦非一邑之私而寔東西兩浙暨天下後世之公也公諱承謨瀋陽人壬辰進士欽授庶吉士賜進士第中憲大夫山西分守冀南道叅議前陜西道監察御史陸光旭頓首拜撰賜進士第通奉大夫山西布政使司左布政使前提督江西通省學政兼按察司僉事陸之祺篆額賜進士第文林郎浙江嘉興府知平湖縣事陳宇宸書教諭任雨蛟縣丞張效錬主簿余司韜典史查德培仝監立糧里士民等仝立石邑庠生曹銘摹丹宛陵劉𢎞逺鐫旹大清康熈龍集癸丑清和月榖旦范忠貞集巻一
