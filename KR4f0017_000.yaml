body:
  text: 范忠貞集别集類六國朝提要臣等謹案范忠貞集十卷國朝范承謨撰承謨字覲公號螺山鑲黃旗漢軍大學士文程子也初充侍衛順治辛卯詔八旗子弟均得應試遂以是科中式舉人次年壬辰成進士改庶吉士授𢎞文院編修官至福建總督康熙壬子逆藩耿精忠叛巡撫劉秉政降於賊承謨抗節死之賜諡忠貞所作畫壁詩石門吳震方嘗刻之說鈴中為世傳誦是編乃其全集為清苑劉可書所編首諭祭文御製碑文御題祠額附以家傳及祠堂記共為一卷次撫浙奏議一卷次督閩奏議一卷次吾廬存稿一卷次百苦吟一卷次畫壁遺稿一卷次雜著一卷次附録題跋哀挽詩文三卷其奏議多有關國計之言詩文直抒胸臆慷慨激昂嚼齦裂眥之狀至今猶可想見文以人重承謨之謂矣乾隆四十五年十月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
  hash: sha256:980b9c9be0b60fe81048a383c11be0e182ffc4f7289789c01cbfdf3e7cfb6467
